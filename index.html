      background: #0b1120;

      -webkit-appearance: none;
      background: transparent;
    }

      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;

    // =========================================================================
    // STATE MANAGEMENT & LOCALSTORAGE
    // =========================================================================
    const STORAGE_KEY_TRIPS = 'konvoi_ride_monitor_trips_v1';
    const STORAGE_KEY_ACTIVE_ID = 'konvoi_ride_monitor_active_id_v1';

    let savedTrips = {};
    let activeTripId = "penang-dec-2026";
    let currentTab = 'ringkasan';
    let selectedDayIndex = 0;
    let itemFilter = 'all'; // 'all' | 'pending' | 'pic'
    let itemSearch = '';

    function loadState() {
      try {
        const rawTrips = localStorage.getItem(STORAGE_KEY_TRIPS);
        const rawActiveId = localStorage.getItem(STORAGE_KEY_ACTIVE_ID);
        if (rawTrips) {
          savedTrips = JSON.parse(rawTrips);
        }
        if (!savedTrips || Object.keys(savedTrips).length === 0) {
          savedTrips = { [DEFAULT_TRIP_DATA.id]: JSON.parse(JSON.stringify(DEFAULT_TRIP_DATA)) };
        }
        // Ensure backward compatibility for notes & paymentRemark fields
        Object.values(savedTrips).forEach(t => {
          if (!Array.isArray(t.notes)) {
            t.notes = t.paymentNote
              ? [{ id: 'n-init', text: t.paymentNote, updatedAt: 'Catatan' }]
              : [];
          }
          if (Array.isArray(t.riders)) {
            t.riders.forEach(r => {
              if (typeof r.paymentRemark !== 'string') r.paymentRemark = '';
            });
          }
        });
        if (rawActiveId && savedTrips[rawActiveId]) {
          activeTripId = rawActiveId;
        } else {
          activeTripId = Object.keys(savedTrips)[0];
        }
      } catch (e) {
        console.error("Storage load error:", e);
        savedTrips = { [DEFAULT_TRIP_DATA.id]: JSON.parse(JSON.stringify(DEFAULT_TRIP_DATA)) };
        activeTripId = DEFAULT_TRIP_DATA.id;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_TRIPS, JSON.stringify(savedTrips));
        localStorage.setItem(STORAGE_KEY_ACTIVE_ID, activeTripId);
      } catch (e) {
        showToast("Gagal simpan ke memori browser.", "error");
      }
    }

    function getTrip() {
      return savedTrips[activeTripId];
    }

    // =========================================================================
    // UTILITIES (Toast, Modal, HTML Escaping)
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function linkifyText(str) {
      const escaped = esc(str);
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-blue-400 underline break-all hover:text-blue-300">$1</a>');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-red-950/95 border-red-500/50 text-red-200'
        : type === 'warning'
        ? 'bg-amber-950/95 border-amber-500/50 text-amber-200'
        : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200';
      toast.className = `px-4 py-3 rounded-xl border ${colors} shadow-xl text-xs font-semibold flex items-center justify-between gap-2 backdrop-blur-md transition-all duration-300 transform translate-y-0 opacity-100`;
      toast.innerHTML = `<span>${esc(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function openModal(htmlContent) {
      const modal = document.getElementById('custom-modal');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = htmlContent;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.add('hidden');
    }

    document.getElementById('custom-modal').addEventListener('click', (e) => {
      if (e.target.id === 'custom-modal') closeModal();

    // =========================================================================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-amber-400', 'bg-amber-500/10');
        btn.classList.add('text-slate-400', 'hover:text-slate-200');
      });
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400', 'hover:text-slate-200');
        activeBtn.classList.add('text-amber-400', 'bg-amber-500/10');
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const trip = getTrip();
      const selector = document.getElementById('header-trip-selector');
      if (selector) {
        selector.innerHTML = Object.keys(savedTrips).map(id => {
          const t = savedTrips[id];
          return `<option value="${esc(id)}" class="bg-[#162032] text-white font-semibold" ${id === activeTripId ? 'selected' : ''}>${esc(t.title)}</option>`;
        }).join('');
      }
      const container = document.getElementById('app-content');

      if (currentTab === 'ringkasan') {
        container.innerHTML = renderRingkasan(trip);
      } else if (currentTab === 'tentatif') {
        container.innerHTML = renderTentatif(trip);
      } else if (currentTab === 'ahli') {
        container.innerHTML = renderAhli(trip);
      } else if (currentTab === 'barang') {
        container.innerHTML = renderBarang(trip);
      }
    }

    function createNewTrip() {
      const rawTitle = document.getElementById('nt-title').value.trim();
      if (!rawTitle) {
        showToast("Sila masukkan nama trip konvoi.", "error");
        return;
      }
      const dateStr = document.getElementById('nt-date').value.trim();
      const numDays = parseInt(document.getElementById('nt-days').value, 10) || 3;
      const homestayName = document.getElementById('nt-homestay').value.trim();
      const gmap = document.getElementById('nt-gmap').value.trim();
      const waze = document.getElementById('nt-waze').value.trim();
      const cost = document.getElementById('nt-cost').value.trim();
      const copyTemplate = document.getElementById('nt-copy-template').checked;

      const fullTitle = dateStr && !rawTitle.includes(dateStr) ? `${rawTitle} (${dateStr})` : rawTitle;
      const newId = 'trip-' + Date.now();
      const sourceTrip = getTrip();

      const generatedDays = [];
      for (let i = 1; i <= numDays; i++) {
        generatedDays.push({
          id: `${newId}-day${i}`,
          label: `Day ${i}`,
          subLabel: dateStr ? `Hari ${i} • ${dateStr}` : `Hari ke-${i}`,
          fullRouteGmap: "",
          checkpoints: [
            {
              id: `${newId}-d${i}-cp1`,
              time: "09:00",
              activity: i === 1 ? "Berkumpul di RV Point & tayar golek" : i === numDays ? "Sarapan, kemas barang & check-out pulang" : "Sarapan pagi & mula bergerak konvoi",
              comment: "Isi minyak penuh sebelum bertolak",
              mapUrl: "",
              done: false
            }
          ]
        });
      }

      const clonedRiders = copyTemplate
        ? sourceTrip.riders.map((r, idx) => ({
            ...r,
            id: `${newId}-r${idx + 1}`,
            paid: false,
            paymentRemark: ""
          }))
        : [];

      const clonedItems = copyTemplate
        ? sourceTrip.items.map((itm, idx) => ({
            ...itm,
            id: `${newId}-i${idx + 1}`,
            checked: false
          }))
        : [];

      const lowRangeNames = clonedRiders
        .filter(r => r.maxKm && r.maxKm <= 280)
        .map(r => `${r.name} (${r.bike} — ${r.maxKm}KM)`)
        .join(' & ');

      savedTrips[newId] = {
        id: newId,
        title: fullTitle,
        dateRange: dateStr,
        paymentNote: cost ? `Kutipan Penginapan: ${cost}` : "Catatan & Kutipan Konvoi",
        notes: [
          {
            id: `${newId}-n1`,
            text: cost ? `Kutipan Penginapan (${homestayName || fullTitle}): ${cost}` : `Info Trip: ${fullTitle}`,
            updatedAt: "Trip Baru"
          }
        ],
        homestay: {
          name: homestayName,
          cost: cost,
          gmap: gmap,
          waze: waze
        },
        fuelAlertNotes: lowRangeNames
          ? `Perhatian jarak tangki: ${lowRangeNames}. Rancang pitstop minyak setiap 120–150KM.`
          : "Pantau jarak tangki motor dalam konvoi dan isi penuh sebelum laluan jauh.",
        tripOdometerKm: 0,
        riders: clonedRiders,
        days: generatedDays,
        items: clonedItems
      };

      activeTripId = newId;
      selectedDayIndex = 0;
      saveState();
      closeModal();
      switchTab('ringkasan');
      showToast(`Trip "${fullTitle}" berjaya dicipta!`);
    }

    function adjustTripDays(delta) {
      const trip = getTrip();
      if (delta > 0) {
        const nextNum = trip.days.length + 1;
        trip.days.push({
          id: `${trip.id}-day${nextNum}-${Date.now()}`,
          label: `Day ${nextNum}`,
          subLabel: `Hari ke-${nextNum}`,
          fullRouteGmap: "",
          checkpoints: [
            { id: `cp-${Date.now()}`, time: "09:00", activity: "Aktiviti konvoi bermula", comment: "", mapUrl: "", done: false }
          ]
        });
        saveState();
        openEditCurrentTripModal();
        render();
        showToast(`Day ${nextNum} ditambah!`);
      } else if (delta < 0 && trip.days.length > 1) {
        const removed = trip.days.pop();
        if (selectedDayIndex >= trip.days.length) selectedDayIndex = trip.days.length - 1;
        saveState();
        openEditCurrentTripModal();
        render();
        showToast(`${removed.label} dibuang.`, "warning");
      }
    }

    // =========================================================================
    // VIEW 1: RINGKASAN (DASHBOARD)
    // =========================================================================
    function renderRingkasan(trip) {
      const totalRiders = trip.riders.length;
      const paidRiders = trip.riders.filter(r => r.paid).length;

      // Checkpoint stats
      let totalCheckpoints = 0;
      let doneCheckpoints = 0;
      trip.days.forEach(d => {
        totalCheckpoints += d.checkpoints.length;
        doneCheckpoints += d.checkpoints.filter(c => c.done).length;
      });
      const cpPercent = totalCheckpoints > 0 ? Math.round((doneCheckpoints / totalCheckpoints) * 100) : 0;

      // Checklist stats
      const totalItems = trip.items.length;
      const checkedItems = trip.items.filter(i => i.checked).length;
      const itemPercent = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;

      // Next pending checkpoint
      let nextCp = null;
      let nextCpDay = '';
      for (const d of trip.days) {
        const found = d.checkpoints.find(c => !c.done);
        if (found) {
          nextCp = found;
          nextCpDay = `${d.label} (${d.subLabel})`;
          break;
        }
      }

      // Low-range bikes alert list
      const lowRangeRiders = trip.riders.filter(r => r.maxKm !== null && r.maxKm <= 280);
      const notesList = Array.isArray(trip.notes) ? trip.notes : [];
      const tripCount = Object.keys(savedTrips).length;

      return `
        <!-- Hero Trip Banner -->
        <div class="bg-gradient-to-br from-[#162032] via-[#1a2740] to-[#0f172a] border border-slate-700/80 rounded-2xl p-4 shadow-lg">

                  ${trip.days.length} Hari • ${totalRiders} Ahli

                ${tripCount > 1 ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">${tripCount} Trip Tersimpan</span>` : ''}

            <button onclick="openEditCurrentTripModal()" class="shrink-0 px-2.5 py-1.5 rounded-xl bg-[#0b1120]/80 hover:bg-slate-800 border border-slate-700 text-[11px] font-bold text-slate-300 transition">
              Edit Trip
            </button>

            <input id="quick-note-input" type="text" placeholder="Tulis catatan baru (cth: Kamal bayar RM100)..."

              class="flex-1 bg-[#0b1120] border border-slate-700/90 focus:border-amber-500 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 outline-none" />

              Simpan
            </button>

          <!-- Notes List -->
          <div class="space-y-2">
            ${notesList.length === 0 ? `
              <div class="text-center py-4 bg-[#0b1120]/60 border border-slate-800/80 rounded-xl text-xs text-slate-500">
                Tiada catatan lagi. Tambah nota kutipan atau peringatan di atas.
              </div>
            ` : notesList.map((note, index) => `
              <div class="bg-[#0b1120]/90 border ${index === 0 ? 'border-amber-500/30' : 'border-slate-800'} rounded-xl p-3 flex items-start justify-between gap-2.5 group">
                <div onclick="openEditNoteModal('${note.id}')" class="cursor-pointer flex-1 min-w-0">
                  <p class="text-xs sm:text-sm text-slate-100 leading-relaxed whitespace-pre-line break-words">${esc(note.text)}</p>
                  ${note.updatedAt ? `<span class="inline-block mt-1 text-[10px] font-mono text-slate-500">${esc(note.updatedAt)} • Tekan untuk edit</span>` : ''}
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button onclick="openEditNoteModal('${note.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-slate-800 transition" title="Edit Nota">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                  </button>
                  <button onclick="deleteNote('${note.id}')" class="p-1.5 rounded-lg text-slate-500 hover:text-red-400 hover:bg-slate-800 transition" title="Padam Nota">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Quick Rider Payment Pills Preview -->
          <div class="pt-2 border-t border-slate-800/80">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-semibold text-slate-400">Status Kutipan Ahli (Tekan untuk tukar):</span>
              <button onclick="switchTab('ahli')" class="text-[11px] font-bold text-amber-400 hover:underline">Urus Detail →</button>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${trip.riders.map(r => `
                <button onclick="toggleRiderPaid('${r.id}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition active:scale-95 ${
                    r.paid
                      ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300'
                      : 'bg-[#0b1120] border-slate-800 text-slate-400 hover:border-slate-600'
                  }">
                  ${r.paid ? '✓' : '○'} ${esc(r.name)}
                </button>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- Next Checkpoint Quick Action Card -->
        ${nextCp ? `
        <div class="bg-[#162032] border border-emerald-500/30 rounded-2xl p-4 shadow-md">
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
              Checkpoint Seterusnya • ${esc(nextCpDay)}
            </span>
            <span class="px-2 py-0.5 rounded-md bg-slate-800 text-amber-400 font-mono text-xs font-bold">${esc(nextCp.time)}</span>
          </div>
          <p class="text-sm font-bold text-white leading-snug">${esc(nextCp.activity)}</p>
          ${nextCp.comment ? `<p class="text-xs text-slate-400 mt-1">${esc(nextCp.comment)}</p>` : ''}
          <div class="flex items-center gap-2 mt-3">
            <button onclick="quickCompleteNextCp('${nextCp.id}')" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95 shadow-lg shadow-emerald-950/50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              Tanda Selesai
            </button>
            <button onclick="switchTab('tentatif')" class="py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition">
              Semua Tentatif
            </button>
          </div>
        </div>
        ` : `
        <div class="bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-4 text-center">
          <p class="text-sm font-bold text-emerald-400">Semua Checkpoint Konvoi Telah Selesai! 🎉</p>
          <p class="text-xs text-slate-400 mt-1">Selamat sampai ke destinasi masing-masing.</p>
        </div>
        `}

        <!-- Homestay Card -->
        ${trip.homestay && trip.homestay.name ? `
        <div class="bg-[#162032] border border-slate-800 rounded-2xl p-4 space-y-3">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Penginapan Utama</div>
              <h3 class="text-sm sm:text-base font-bold text-white mt-0.5">${esc(trip.homestay.name)}</h3>
              ${trip.homestay.cost ? `<span class="inline-block mt-1 px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-300 border border-amber-500/20 text-xs font-semibold">${esc(trip.homestay.cost)}</span>` : ''}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5 pt-1">
            ${trip.homestay.gmap ? `
            <a href="${esc(trip.homestay.gmap)}" target="_blank" rel="noopener noreferrer"
              class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-300 text-xs font-bold transition active:scale-95">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Google Maps
            </a>` : ''}
            ${trip.homestay.waze ? `
            <a href="${esc(trip.homestay.waze)}" target="_blank" rel="noopener noreferrer"
              class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cyan-600/20 hover:bg-cyan-600/30 border border-cyan-500/40 text-cyan-300 text-xs font-bold transition active:scale-95">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              Waze
            </a>` : ''}
          </div>
        </div>
        ` : ''}

        <!-- Amaran Jarak Minyak (Fuel Range Alert) -->
        <div class="bg-amber-950/25 border border-amber-500/40 rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-amber-400">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
              <h3 class="text-sm font-extrabold uppercase tracking-wide">Amaran Jarak Minyak</h3>
            </div>
            <button onclick="switchTab('ahli')" class="text-xs font-bold text-amber-400 hover:underline">Kalkulator KM →</button>
          </div>

          <p class="text-xs text-slate-300 leading-relaxed">
            ${esc(trip.fuelAlertNotes || 'Pantau jarak tangki kecil supaya konvoi tidak terputus di lebuh raya.')}
          </p>

          ${lowRangeRiders.length > 0 ? `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
            ${lowRangeRiders.map(r => `
              <div class="bg-[#0b1120]/90 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-white">${esc(r.name)} <span class="text-amber-400">(${esc(r.bike)})</span></div>
                  <div class="text-[11px] text-slate-400 mt-0.5">${esc(r.fuelNote)}</div>
                </div>
                <span class="shrink-0 px-2 py-1 rounded-lg bg-amber-500/15 text-amber-400 font-mono text-xs font-bold">
                  ${r.maxKm}KM
                </span>
              </div>
            `).join('')}
          </div>
          ` : ''}
        </div>
      `;
    }

    function quickCompleteNextCp(cpId) {
      const trip = getTrip();
      for (const d of trip.days) {
        const cp = d.checkpoints.find(c => c.id === cpId);
        if (cp) {
          cp.done = true;
          saveState();
          render();
          showToast(`Selesai: ${cp.time} — ${cp.activity.substring(0, 35)}...`);
          break;
        }
      }
    }

    // =========================================================================
    // NOTES / CATATAN MANAGEMENT FUNCTIONS
    // =========================================================================
    function formatNowTimestamp() {
      const now = new Date();
      return now.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short' }) + ' ' +
        now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
    }

    function addQuickNote() {
      const input = document.getElementById('quick-note-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) {
        showToast("Sila tulis catatan terlebih dahulu.", "error");
        return;
      }
      const trip = getTrip();
      if (!Array.isArray(trip.notes)) trip.notes = [];
      trip.notes.unshift({
        id: 'note-' + Date.now(),
        text,
        updatedAt: formatNowTimestamp()
      });
      trip.paymentNote = trip.notes[0].text;
      saveState();
      render();
      showToast("Catatan berjaya disimpan!");
    }

    function openAddNoteModal() {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Tambah Catatan / Info Kutipan</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">✕</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Isi Catatan</label>
            <textarea id="modal-note-text" rows="4" placeholder="Contoh: Pembayaran RM100 kepada Epul (Deposit RM100 + Homestay RM400)..." class="w-full bg-[#0b1120] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-amber-500 outline-none"></textarea>
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Batal</button>
          <button onclick="saveNewModalNote()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold">Simpan Nota</button>
        </div>
      `);
      setTimeout(() => document.getElementById('modal-note-text')?.focus(), 50);
    }

    function saveNewModalNote() {
      const text = document.getElementById('modal-note-text').value.trim();
      if (!text) {
        showToast("Sila masukkan teks catatan.", "error");
        return;
      }
      const trip = getTrip();
      if (!Array.isArray(trip.notes)) trip.notes = [];
      trip.notes.unshift({
        id: 'note-' + Date.now(),
        text,
        updatedAt: formatNowTimestamp()
      });
      trip.paymentNote = trip.notes[0].text;
      saveState();
      closeModal();
      render();
      showToast("Nota baru ditambah!");
    }

    function openEditNoteModal(noteId) {
      const trip = getTrip();
      const note = (trip.notes || []).find(n => n.id === noteId);
      if (!note) return;

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Edit Catatan Konvoi</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">✕</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Teks Catatan / Kutipan</label>
            <textarea id="edit-note-textarea" rows="4" class="w-full bg-[#0b1120] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-amber-500 outline-none">${esc(note.text)}</textarea>
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="deleteNote('${note.id}'); closeModal();" class="px-3 py-2.5 rounded-xl bg-red-950/80 border border-red-500/40 text-red-300 text-xs font-bold">Padam</button>
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Batal</button>
          <button onclick="updateNote('${note.id}')" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold">Kemaskini</button>
        </div>
      `);
      setTimeout(() => document.getElementById('edit-note-textarea')?.focus(), 50);
    }

    function updateNote(noteId) {
      const trip = getTrip();
      const note = (trip.notes || []).find(n => n.id === noteId);
      if (!note) return;
      const newText = document.getElementById('edit-note-textarea').value.trim();
      if (!newText) {
        showToast("Catatan tidak boleh kosong.", "error");
        return;
      }
      note.text = newText;
      note.updatedAt = "Diedit " + formatNowTimestamp();
      if (trip.notes[0]?.id === noteId) {
        trip.paymentNote = newText;
      }
      saveState();
      closeModal();
      render();
      showToast("Catatan dikemaskini!");
    }

    function deleteNote(noteId) {
      const trip = getTrip();
      trip.notes = (trip.notes || []).filter(n => n.id !== noteId);
      trip.paymentNote = trip.notes.length > 0 ? trip.notes[0].text : '';
      saveState();
      render();
      showToast("Catatan dipadam.", "warning");
    }

    // =========================================================================
    // VIEW 2: TENTATIF & LALUAN (ITINERARY)
    // =========================================================================
    function renderTentatif(trip) {
      if (!trip.days || trip.days.length === 0) {
        return `<div class="text-center py-10 text-slate-400 text-sm">Tiada data tentatif dijumpai.</div>`;
      }
      if (selectedDayIndex >= trip.days.length) selectedDayIndex = 0;
      const activeDay = trip.days[selectedDayIndex];
      const doneCount = activeDay.checkpoints.filter(c => c.done).length;
      const totalCount = activeDay.checkpoints.length;

      return `
        <!-- Day Selector Pills -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          ${trip.days.map((d, idx) => {
            const isSelected = idx === selectedDayIndex;
            const dDone = d.checkpoints.filter(c => c.done).length;
            const dTot = d.checkpoints.length;
            return `
              <button onclick="selectDay(${idx})"
                class="flex-1 min-w-[105px] py-2.5 px-3 rounded-xl border text-left transition active:scale-95 ${
                  isSelected
                    ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg shadow-amber-500/20'
                    : 'bg-[#162032] text-slate-300 border-slate-800 hover:border-slate-700'
                }">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold">${esc(d.label)}</span>
                  <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded ${isSelected ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-slate-400'}">${dDone}/${dTot}</span>
                </div>
                <div class="text-[11px] font-medium truncate mt-0.5 ${isSelected ? 'text-slate-900' : 'text-slate-400'}">${esc(d.subLabel)}</div>
              </button>
            `;
          }).join('')}
        </div>

        <!-- Day Header & Full-Day Route Button -->
        <div class="bg-[#162032] border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-base font-extrabold text-white">${esc(activeDay.label)} — ${esc(activeDay.subLabel)}</h2>
            <p class="text-xs text-slate-400 mt-0.5">Progress Hari Ini: <span class="font-mono font-bold text-emerald-400">${doneCount}/${totalCount}</span> checkpoint</p>
          </div>
          <div class="flex items-center gap-2">
            ${activeDay.fullRouteGmap ? `
              <a href="${esc(activeDay.fullRouteGmap)}" target="_blank" rel="noopener noreferrer"
                class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition active:scale-95 shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Laluan Penuh (Maps)
              </a>
            ` : ''}
            <button onclick="openAddCheckpointModal()"
              class="inline-flex items-center justify-center gap-1 px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 text-xs font-bold transition active:scale-95">
              + Tambah
            </button>
          </div>
        </div>

        <!-- Timeline Cards -->
        <div class="relative pl-4 sm:pl-5 space-y-3 before:content-[''] before:absolute before:left-[7px] sm:before:left-[9px] before:top-3 before:bottom-3 before:w-0.5 before:bg-slate-800">
          ${activeDay.checkpoints.map((cp) => {
            const isFuel = /minyak|petronas|shell|full tank/i.test(cp.activity + ' ' + cp.comment);
            return `
              <div class="relative bg-[#162032] border ${cp.done ? 'border-emerald-500/40 bg-emerald-950/10' : isFuel ? 'border-amber-500/40' : 'border-slate-800'} rounded-2xl p-4 transition shadow-sm">
                <!-- Timeline Dot -->
                <span class="absolute -left-[14px] sm:-left-[16px] top-5 w-3.5 h-3.5 rounded-full border-2 border-[#0b1120] ${cp.done ? 'bg-emerald-400' : isFuel ? 'bg-amber-400' : 'bg-slate-600'}"></span>

                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-2.5 py-1 rounded-lg bg-[#0b1120] border border-slate-700/80 font-mono text-xs font-bold ${cp.done ? 'text-emerald-400' : 'text-amber-400'}">
                      ${esc(cp.time)}
                    </span>
                    ${isFuel ? `<span class="px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-300 border border-amber-500/30 text-[10px] font-bold uppercase">⛽ Pitstop Minyak</span>` : ''}
                  </div>

                  <!-- Edit Note Button -->
                  <button onclick="openEditCheckpointModal('${cp.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Edit Catatan">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  </button>
                </div>

                <h3 class="text-sm font-bold mt-2 leading-snug ${cp.done ? 'line-through text-slate-400' : 'text-white'}">
                  ${esc(cp.activity)}
                </h3>

                ${cp.comment ? `
                  <p class="text-xs text-slate-400 mt-1.5 leading-relaxed bg-[#0b1120]/60 p-2.5 rounded-xl border border-slate-800/80">
                    ${linkifyText(cp.comment)}
                  </p>
                ` : ''}

                <div class="flex items-center gap-2 mt-3 pt-2 border-t border-slate-800/80">
                  <button onclick="toggleCheckpoint('${cp.id}')"
                    class="flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95 ${
                      cp.done
                        ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                        : 'bg-slate-800 hover:bg-emerald-600 hover:text-white text-slate-200 border border-slate-700'
                    }">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    ${cp.done ? 'Selesai / Checked-in' : 'Selesai / Check-in'}
                  </button>

                  ${cp.mapUrl ? `
                    <a href="${esc(cp.mapUrl)}" target="_blank" rel="noopener noreferrer"
                      class="py-2.5 px-3.5 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-300 text-xs font-bold flex items-center gap-1.5 transition active:scale-95">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                      Maps
                    </a>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function selectDay(idx) {
      selectedDayIndex = idx;
      render();
    }

    function toggleCheckpoint(cpId) {
      const trip = getTrip();
      const day = trip.days[selectedDayIndex];
      const cp = day.checkpoints.find(c => c.id === cpId);
      if (cp) {
        cp.done = !cp.done;
        saveState();
        render();

    function saveNewCheckpoint() {
      const time = document.getElementById('new-cp-time').value.trim() || "00:00";
      const activity = document.getElementById('new-cp-act').value.trim();
      const comment = document.getElementById('new-cp-comment').value.trim();
      const mapUrl = document.getElementById('new-cp-map').value.trim();
      if (!activity) {
        showToast("Sila masukkan nama aktiviti.", "error");
        return;
      }
      const trip = getTrip();
      trip.days[selectedDayIndex].checkpoints.push({
        id: 'cp-' + Date.now(),
        time,
        activity,
        comment,
        mapUrl,
        done: false
      });
      saveState();
      closeModal();
      render();
      showToast("Checkpoint berjaya ditambah!");
    }

    function updateCheckpoint(cpId) {

      const cp = day.checkpoints.find(c => c.id === cpId);
      if (!cp) return;
      cp.time = document.getElementById('edit-cp-time').value.trim() || cp.time;
      cp.activity = document.getElementById('edit-cp-act').value.trim() || cp.activity;
      cp.comment = document.getElementById('edit-cp-comment').value.trim();
      cp.mapUrl = document.getElementById('edit-cp-map').value.trim();
      saveState();
      closeModal();
      render();
      showToast("Checkpoint dikemaskini!");

    function deleteCheckpoint(cpId) {
      const trip = getTrip();
      const day = trip.days[selectedDayIndex];
      day.checkpoints = day.checkpoints.filter(c => c.id !== cpId);
      saveState();
      closeModal();
      render();
      showToast("Checkpoint dipadam.", "warning");
    }

    // =========================================================================
    // VIEW 3: AHLI & MINYAK (RIDERS & FUEL MONITOR)
    // =========================================================================
    function renderAhli(trip) {
      const odo = Number(trip.tripOdometerKm) || 0;
      const paidCount = trip.riders.filter(r => r.paid).length;

      return `
        <!-- Interactive Fuel Range & Trip Odometer Calculator -->
        <div class="bg-gradient-to-br from-[#162032] to-[#0f172a] border border-amber-500/40 rounded-2xl p-4 shadow-lg space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-amber-400">⛽ Kalkulator Jarak & Baki Tangki</span>
              <h2 class="text-sm sm:text-base font-extrabold text-white mt-0.5">Simulasi Trip Odometer (Sejak Full Tank)</h2>
            </div>
            <button onclick="updateOdometer(0)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 border border-slate-700 transition">
              Reset 0 KM
            </button>
          </div>

          <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-3 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <span class="text-xs text-slate-400 font-medium">Jarak Perjalanan:</span>
              <div class="flex items-center gap-1.5">
                <input type="number" min="0" max="450" value="${odo}"
                  oninput="updateOdometer(this.value)"
                  class="w-20 bg-[#162032] border border-amber-500/50 rounded-lg px-2.5 py-1 text-right font-mono text-base font-extrabold text-amber-400 focus:outline-none" />
                <span class="text-xs font-bold text-slate-400">KM</span>
              </div>
            </div>
            <input type="range" min="0" max="400" step="5" value="${Math.min(odo, 400)}"
              oninput="updateOdometer(this.value)" class="w-full" />
            <div class="flex justify-between text-[10px] font-mono text-slate-500">
              <span>0 KM</span>
              <span>100 KM</span>
              <span>200 KM</span>
              <span>300 KM</span>
              <span>400 KM</span>
            </div>
          </div>
        </div>

        <!-- Riders Header & Kutipan Summary -->
        <div class="flex items-center justify-between gap-2">
          <div>
            <h3 class="text-sm font-extrabold text-white">Senarai Ahli Konvoi (${trip.riders.length})</h3>
            <p class="text-xs text-slate-400">Bayaran Homestay: <span class="text-emerald-400 font-bold font-mono">${paidCount}/${trip.riders.length}</span> (RM${paidCount * 100})</p>
          </div>
          <button onclick="openAddRiderModal()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold transition active:scale-95">
            + Ahli
          </button>
        </div>

        <!-- Riders List Cards -->
        <div class="space-y-3">
          ${trip.riders.map(r => {
            let statusBadge = '';
            let progressHtml = '';

            if (r.maxKm && r.maxKm > 0) {
              const remaining = r.maxKm - odo;
              const pctRemaining = Math.max(0, Math.min(100, Math.round((remaining / r.maxKm) * 100)));
              const warnThreshold = r.warnKm || Math.round(r.maxKm * 0.78);

              if (odo >= r.maxKm) {
                statusBadge = `<span class="px-2 py-0.5 rounded-md bg-red-500/20 border border-red-500/50 text-red-300 text-[11px] font-extrabold animate-pulse">🚨 HABIS MINYAK! (${remaining} KM)</span>`;
              } else if (odo >= warnThreshold) {
                statusBadge = `<span class="px-2 py-0.5 rounded-md bg-amber-500/20 border border-amber-500/50 text-amber-300 text-[11px] font-extrabold">⚠️ 2 BAR / ISI SEGERA (Baki ~${remaining} KM)</span>`;
              } else {
                statusBadge = `<span class="px-2 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[11px] font-bold">✅ Selamat (Baki ~${remaining} KM)</span>`;
              }

              const barColor = odo >= r.maxKm ? 'bg-red-500' : odo >= warnThreshold ? 'bg-amber-500' : 'bg-emerald-500';
              progressHtml = `
                <div class="mt-2.5">
                  <div class="flex justify-between text-[11px] font-mono mb-1">
                    <span class="text-slate-400">Baki Tangki Anggaran</span>
                    <span class="font-bold text-slate-200">${Math.max(0, remaining)} / ${r.maxKm} KM</span>
                  </div>
                  <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div class="${barColor} h-full rounded-full transition-all duration-200" style="width: ${pctRemaining}%"></div>
                  </div>
                </div>
              `;
            } else {
              statusBadge = `<span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 text-[11px] font-semibold">🛵 Pembonceng (Pillion)</span>`;
            }

            return `
              <div class="bg-[#162032] border ${r.maxKm && odo >= r.maxKm ? 'border-red-500/60' : r.maxKm && odo >= (r.warnKm || r.maxKm*0.78) ? 'border-amber-500/50' : 'border-slate-800'} rounded-2xl p-4 space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="w-6 h-6 rounded-lg bg-slate-800 text-amber-400 font-mono text-xs font-bold flex items-center justify-center">${r.no}</span>
                      <h4 class="text-base font-extrabold text-white">${esc(r.name)}</h4>
                      <span class="px-2 py-0.5 rounded-md bg-slate-800/90 border border-slate-700 text-xs font-semibold text-slate-200">${esc(r.bike)}</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 mt-2">
                      ${statusBadge}
                      ${r.tumpang && r.tumpang !== '-' ? `<span class="px-2 py-0.5 rounded-md bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-[11px] font-semibold">Tumpang: ${esc(r.tumpang)}</span>` : ''}
                    </div>
                  </div>

                  <button onclick="openEditRiderModal('${r.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  </button>
                </div>

                ${r.fuelNote ? `<p class="text-xs text-slate-400 bg-[#0b1120]/70 px-3 py-2 rounded-xl border border-slate-800/80">${esc(r.fuelNote)}</p>` : ''}

                ${progressHtml}

                <div class="pt-2 border-t border-slate-800/80 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-[11px] text-slate-400">Status Kutipan / Homestay</span>
                    <button onclick="toggleRiderPaid('${r.id}')"
                      class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition active:scale-95 ${
                        r.paid
                          ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                          : 'bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 border border-slate-700'
                      }">
                      ${r.paid ? '✅ Dah Bayar' : '💳 Tandakan Bayar'}
                    </button>
                  </div>
                  <div class="flex items-center gap-2">
                    <input type="text" value="${esc(r.paymentRemark || '')}"
                      onchange="updateRiderPaymentRemark('${r.id}', this.value)"
                      placeholder="Nota bayaran ahli (cth: Transfer RM100 ke Epul)..."
                      class="flex-1 bg-[#0b1120] border border-slate-800 focus:border-amber-500 rounded-lg px-2.5 py-1.5 text-[11px] text-slate-200 placeholder-slate-600 outline-none" />
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function updateRiderPaymentRemark(riderId, val) {
      const trip = getTrip();
      const rider = trip.riders.find(r => r.id === riderId);
      if (rider) {
        rider.paymentRemark = val.trim();
        saveState();
        showToast(`Nota bayaran ${rider.name} disimpan.`);
      }
    }

    function updateOdometer(val) {
      const trip = getTrip();
      let num = parseInt(val, 10);
      if (isNaN(num) || num < 0) num = 0;
      if (num > 500) num = 500;
      trip.tripOdometerKm = num;
      saveState();
      render();
    }

    function toggleRiderPaid(riderId) {
      const trip = getTrip();
      const rider = trip.riders.find(r => r.id === riderId);
      if (rider) {
        rider.paid = !rider.paid;
        saveState();
        render();
        showToast(`${rider.name}: ${rider.paid ? 'Bayaran RM100 direkodkan!' : 'Status bayaran dibatalkan.'}`);
      }
    }

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Tambah Ahli Konvoi</h3>

            <input id="r-note" type="text" placeholder="cth: 250KM Full tank" class="w-full bg-[#0b1120] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-amber-500" />
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Batal</button>
          <button onclick="saveNewRider()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold">Simpan Ahli</button>
        </div>
      `);
    }

    function saveNewRider() {
      const name = document.getElementById('r-name').value.trim();
      if (!name) {
        showToast("Sila masukkan nama ahli.", "error");
        return;
      }
      const bike = document.getElementById('r-bike').value.trim() || "N/a";
      const tumpang = document.getElementById('r-tumpang').value.trim() || "-";
      const maxKmRaw = parseInt(document.getElementById('r-maxkm').value, 10);
      const warnKmRaw = parseInt(document.getElementById('r-warnkm').value, 10);
      const fuelNote = document.getElementById('r-note').value.trim();

      const trip = getTrip();
      trip.riders.push({
        id: 'r-' + Date.now(),
        no: trip.riders.length + 1,
        name,
        bike,
        tumpang,
        fuelNote,
        maxKm: isNaN(maxKmRaw) ? null : maxKmRaw,
        warnKm: isNaN(warnKmRaw) ? (isNaN(maxKmRaw) ? null : Math.round(maxKmRaw * 0.78)) : warnKmRaw,
        paid: false,
        paymentRemark: ""
      });
      saveState();
      closeModal();
      render();
      showToast(`Ahli ${name} ditambah!`);
    }

    function updateRider(riderId) {
      const trip = getTrip();
      const r = trip.riders.find(x => x.id === riderId);
      if (!r) return;
      r.name = document.getElementById('er-name').value.trim() || r.name;
      r.bike = document.getElementById('er-bike').value.trim() || "N/a";
      r.tumpang = document.getElementById('er-tumpang').value.trim() || "-";
      const maxKmRaw = parseInt(document.getElementById('er-maxkm').value, 10);
      const warnKmRaw = parseInt(document.getElementById('er-warnkm').value, 10);
      r.maxKm = isNaN(maxKmRaw) ? null : maxKmRaw;
      r.warnKm = isNaN(warnKmRaw) ? (isNaN(maxKmRaw) ? null : Math.round(maxKmRaw * 0.78)) : warnKmRaw;
      r.fuelNote = document.getElementById('er-note').value.trim();
      saveState();
      closeModal();
      render();
      showToast("Maklumat ahli dikemaskini!");
    }

    function deleteRider(riderId) {
      const trip = getTrip();
      trip.riders = trip.riders.filter(x => x.id !== riderId).map((x, i) => ({ ...x, no: i + 1 }));
      saveState();
      closeModal();
      render();
      showToast("Ahli dipadam.", "warning");
    }

    // =========================================================================
    // VIEW 4: BARANGAN & IMPORT EXCEL (.XLSX)
    // =========================================================================
    function renderBarang(trip) {
      const checkedCount = trip.items.filter(i => i.checked).length;
      const totalCount = trip.items.length;

      // Filter items
      const filteredItems = trip.items.filter(item => {
        const matchesSearch = (item.name + ' ' + item.pic + ' ' + item.comment).toLowerCase().includes(itemSearch.toLowerCase());
        if (!matchesSearch) return false;
        if (itemFilter === 'pending') return !item.checked;
        if (itemFilter === 'pic') return item.pic && item.pic.trim() !== '';
        return true;
      });

      const tripKeys = Object.keys(savedTrips);

      return `
        <!-- Checklist Section -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-base font-extrabold text-white">Checklist Barangan Konvoi</h2>
              <p class="text-xs text-slate-400">Siap Disediakan: <span class="font-mono font-bold text-emerald-400">${checkedCount}/${totalCount}</span></p>
            </div>
            <button onclick="openAddItemModal()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold transition active:scale-95">
              + Barang
            </button>
          </div>

          <!-- Search & Filter Pills -->
          <div class="space-y-2">
            <input type="text" value="${esc(itemSearch)}" oninput="setItemSearch(this.value)"
              placeholder="Cari barang, pembawa (cth: Epul, Irfan)..."
              class="w-full bg-[#162032] border border-slate-800 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 outline-none" />

            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              <button onclick="setItemFilter('all')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${itemFilter === 'all' ? 'bg-amber-500 text-slate-950' : 'bg-[#162032] text-slate-400 border border-slate-800'}">
                Semua (${totalCount})
              </button>
              <button onclick="setItemFilter('pending')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${itemFilter === 'pending' ? 'bg-amber-500 text-slate-950' : 'bg-[#162032] text-slate-400 border border-slate-800'}">
                Belum Sedia (${totalCount - checkedCount})
              </button>
              <button onclick="setItemFilter('pic')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${itemFilter === 'pic' ? 'bg-amber-500 text-slate-950' : 'bg-[#162032] text-slate-400 border border-slate-800'}">
                Ada PIC / Catatan (${trip.items.filter(i => i.pic && i.pic.trim() !== '').length})
              </button>
            </div>
          </div>

          <!-- Checklist Items -->
          <div class="space-y-2">
            ${filteredItems.length === 0 ? `
              <div class="text-center py-6 bg-[#162032] border border-slate-800 rounded-2xl text-xs text-slate-400">
                Tiada barangan sepadan dengan carian/penapis.
              </div>
            ` : filteredItems.map(item => `
              <div class="bg-[#162032] border ${item.checked ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-slate-800'} rounded-xl p-3 flex items-center justify-between gap-3 transition">
                <button onclick="toggleItemCheck('${item.id}')" class="flex items-center gap-3 flex-1 text-left min-w-0">
                  <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition ${
                    item.checked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600 bg-[#0b1120]'
                  }">
                    ${item.checked ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="text-sm font-bold truncate ${item.checked ? 'line-through text-slate-500' : 'text-white'}">
                      <span class="text-xs font-mono text-slate-500 mr-1">${item.no}.</span>${esc(item.name)}
                    </div>
                    ${(item.pic || item.comment) ? `
                      <div class="flex flex-wrap items-center gap-1.5 mt-1">
                        ${item.pic ? `<span class="px-2 py-0.5 rounded bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[10px] font-bold">PIC: ${esc(item.pic)}</span>` : ''}
                        ${item.comment ? `<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px] font-medium">${esc(item.comment)}</span>` : ''}
                      </div>
                    ` : ''}
                  </div>
                </button>

                <button onclick="deleteItem('${item.id}')" class="p-2 text-slate-500 hover:text-red-400 transition shrink-0" title="Padam Barang">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Excel Importer & Trip Manager Section -->
        <div id="excel-upload-box" class="bg-[#162032] border border-slate-700/80 rounded-2xl p-4 space-y-4 mt-6">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-extrabold text-white">Import Fail Excel Konvoi (.xlsx)</h3>
              <p class="text-xs text-slate-400 mt-0.5">Muat naik fail Excel konvoi lain dari telefon anda (tab: <span class="text-slate-300 font-mono">Ahli, Day1, Day2, Day3, Barangan</span>). Diproses 100% offline dalam browser!</p>
            </div>
          </div>

          <label class="block w-full cursor-pointer border-2 border-dashed border-slate-700 hover:border-amber-500/70 bg-[#0b1120]/80 rounded-xl p-4 text-center transition">
            <input type="file" accept=".xlsx,.xls" onchange="handleExcelUpload(event)" class="hidden" />
            <div class="text-xs font-bold text-amber-400">📂 Pilih Fail Excel (.xlsx) dari Telefon</div>
            <div class="text-[11px] text-slate-500 mt-1">Tekan di sini untuk pilih fail</div>
          </label>

          <!-- Saved Trips Switcher -->
          <div class="space-y-2 pt-2 border-t border-slate-800">
            <div class="text-xs font-bold text-slate-300">Senarai Konvoi Tersimpan (Offline):</div>
            <div class="space-y-1.5">
              ${tripKeys.map(k => {
                const t = savedTrips[k];
                const isAct = k === activeTripId;
                return `
                  <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl border ${isAct ? 'bg-amber-500/10 border-amber-500/40' : 'bg-[#0b1120] border-slate-800'}">
                    <button onclick="switchSavedTrip('${k}')" class="text-left flex-1 min-w-0">
                      <div class="text-xs font-bold truncate ${isAct ? 'text-amber-400' : 'text-slate-200'}">${esc(t.title)}</div>
                      <div class="text-[10px] text-slate-500">${t.riders.length} ahli • ${t.days.length} hari</div>
                    </button>
                    ${k !== DEFAULT_TRIP_DATA.id ? `
                      <button onclick="deleteSavedTrip('${k}')" class="px-2 py-1 rounded bg-red-950/60 text-red-400 text-[10px] font-bold">Padam</button>
                    ` : `<span class="text-[10px] font-mono text-slate-500 px-2">Default</span>`}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Backup JSON & Reset -->
          <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800">
            <button onclick="exportJsonBackup()" class="py-2 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-bold text-center transition">
              Export JSON
            </button>
            <label class="cursor-pointer py-2 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-bold text-center transition">
              Import JSON
              <input type="file" accept=".json" onchange="importJsonBackup(event)" class="hidden" />
            </label>
            <button onclick="confirmResetDefault()" class="py-2 px-2 rounded-xl bg-red-950/70 hover:bg-red-900/70 border border-red-500/30 text-red-300 text-[11px] font-bold text-center transition">
              Reset Asal
            </button>
          </div>
        </div>
      `;
    }

    function setItemSearch(val) {
      itemSearch = val;
      render();
    }

    function setItemFilter(f) {
      itemFilter = f;
      render();
    }

    function toggleItemCheck(itemId) {
      const trip = getTrip();
      const item = trip.items.find(i => i.id === itemId);
      if (item) {
        item.checked = !item.checked;
        saveState();
        render();
      }
    }

    function deleteItem(itemId) {
      const trip = getTrip();
      trip.items = trip.items.filter(i => i.id !== itemId).map((x, idx) => ({ ...x, no: idx + 1 }));
      saveState();
      render();
      showToast("Barang dipadam.", "warning");
    }

    function openAddItemModal() {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Tambah Barangan</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">✕</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Barangan</label>
            <input id="item-name" type="text" placeholder="cth: Powerbank / Kabel Jumper" class="w-full bg-[#0b1120] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Pembawa / Kuantiti (Opsyenal)</label>
            <input id="item-pic" type="text" placeholder="cth: Semua / Irfan / 2 biji" class="w-full bg-[#0b1120] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Komen (Opsyenal)</label>
            <input id="item-comment" type="text" placeholder="cth: Wajib bawa" class="w-full bg-[#0b1120] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-amber-500" />
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Batal</button>
          <button onclick="saveNewItem()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold">Tambah</button>
        </div>
      `);
    }

    function saveNewItem() {
      const name = document.getElementById('item-name').value.trim();
      if (!name) {
        showToast("Sila masukkan nama barangan.", "error");
        return;
      }
      const pic = document.getElementById('item-pic').value.trim();
      const comment = document.getElementById('item-comment').value.trim();
      const trip = getTrip();
      trip.items.push({
        id: 'item-' + Date.now(),
        no: trip.items.length + 1,
        name,
        pic,
        comment,
        checked: false
      });
      saveState();
      closeModal();
      render();
      showToast(`"${name}" ditambah ke senarai!`);
    }

    // =========================================================================
    // CLIENT-SIDE EXCEL (.XLSX) PARSER USING SHEETJS
    // =========================================================================
    function formatExcelTime(val) {
      if (val === null || val === undefined || val === '') return '00:00';
      if (typeof val === 'number') {
        // Excel serial fraction of a day
        const totalMinutes = Math.round(val * 24 * 60);
        const hrs = Math.floor(totalMinutes / 60) % 24;
        const mins = totalMinutes % 60;
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
      }
      const str = String(val).trim();
      const match = str.match(/(\d{1,2}):(\d{2})/);
      if (match) {
        return `${match[1].padStart(2, '0')}:${match[2]}`;
      }
      return str;
    }

    function extractUrlFromText(text) {
      if (!text) return '';
      const match = String(text).match(/https?:\/\/[^\s]+/);
      return match ? match[0] : '';
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (typeof XLSX === 'undefined') {
        showToast("Library SheetJS gagal dimuatkan. Sila semak sambungan.", "error");
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const newTripId = 'trip-' + Date.now();
          const baseTitle = file.name.replace(/\.(xlsx|xls)$/i, '');

          const parsedTrip = {
            id: newTripId,
            title: `Konvoi ${baseTitle}`,
            paymentNote: "Kutipan Konvoi",
            notes: [],
            homestay: { name: "", cost: "", gmap: "", waze: "" },
            fuelAlertNotes: "Pantau jarak tangki kecil dalam konvoi.",
            tripOdometerKm: 0,
            riders: [],
            days: [],
            items: []
          };

          workbook.SheetNames.forEach(sheetName => {
            const ws = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            const lowerName = sheetName.toLowerCase();

            // 1. Parse 'Ahli' sheet
            if (lowerName.includes('ahli') || lowerName.includes('rider')) {
              let headerFound = false;
              rows.forEach(row => {
                const c0 = String(row[0] || '').trim();
                const c1 = String(row[1] || '').trim();
                const c2 = String(row[2] || '').trim();
                const c3 = String(row[3] || '').trim();
                const c4 = String(row[4] || '').trim();

                if (c0.toLowerCase().includes('bil') && c1.toLowerCase().includes('nama')) {
                  headerFound = true;
                  return;
                }
                if (c0.toLowerCase().includes('pembayaran')) {
                  parsedTrip.paymentNote = c0;
                  parsedTrip.notes.push({
                    id: 'note-' + parsedTrip.notes.length + '-' + Date.now(),
                    text: c0,
                    updatedAt: 'Dari Excel'
                  });
                  return;
                }
                if (headerFound && c1) {
                  // Extract maxKm & warnKm heuristically from fuel note
                  const kmMatches = [...c4.matchAll(/(\d{2,3})\s*km/gi)].map(m => parseInt(m[1], 10));
                  let maxKm = null;
                  let warnKm = null;
                  if (kmMatches.length > 0) {
                    maxKm = Math.max(...kmMatches);
                    warnKm = kmMatches.length > 1 ? Math.min(...kmMatches) : Math.round(maxKm * 0.78);
                  }
                  parsedTrip.riders.push({
                    id: 'r-' + parsedTrip.riders.length + '-' + Date.now(),
                    no: parsedTrip.riders.length + 1,
                    name: c1,
                    bike: c2 || 'N/a',
                    tumpang: c3 || '-',
                    fuelNote: c4,
                    maxKm,
                    warnKm,
                    paid: false,
                    paymentRemark: ""
                  });
                }
              });
            }

            // 2. Parse 'Day...' sheets
            else if (lowerName.startsWith('day') || lowerName.includes('hari')) {
              const dayObj = {
                id: 'day-' + parsedTrip.days.length + '-' + Date.now(),
                label: sheetName.split(' ')[0] || sheetName,
                subLabel: sheetName.split(' ').slice(1).join(' ') || '',
                fullRouteGmap: '',
                checkpoints: []
              };

              let tableStarted = false;
              rows.forEach(row => {
                const c0 = String(row[0] || '').trim();
                const c1 = String(row[1] || '').trim();
                const c2 = String(row[2] || '').trim();
                const c3 = String(row[3] || '').trim();

                if (c0.toLowerCase() === 'aktiviti' && c1) {
                  dayObj.subLabel = c1;
                } else if (c0.toLowerCase().includes('homestay') && c1) {
                  if (!parsedTrip.homestay.name) parsedTrip.homestay.name = c1;
                } else if (c0.toLowerCase().includes('gmap') && c1) {
                  if (!parsedTrip.homestay.gmap) parsedTrip.homestay.gmap = extractUrlFromText(c1) || c1;
                } else if (c0.toLowerCase().includes('waze') && c1) {
                  if (!parsedTrip.homestay.waze) parsedTrip.homestay.waze = extractUrlFromText(c1) || c1;
                } else if (c0.toLowerCase() === 'masa') {
                  tableStarted = true;
                } else if (tableStarted && c1) {
                  const timeStr = formatExcelTime(row[0]);
                  const combinedComment = [c2 ? `Backup: ${c2}` : '', c3].filter(Boolean).join(' | ');
                  const foundUrl = extractUrlFromText(c3) || extractUrlFromText(c1);
                  if (!dayObj.fullRouteGmap && combinedComment.toLowerCase().includes('seluruh perjalanan') && foundUrl) {
                    dayObj.fullRouteGmap = foundUrl;
                  }
                  dayObj.checkpoints.push({
                    id: 'cp-' + dayObj.checkpoints.length + '-' + Date.now(),
                    time: timeStr,
                    activity: c1,
                    comment: combinedComment,
                    mapUrl: foundUrl,
                    done: false
                  });
                }
              });

              if (dayObj.checkpoints.length > 0) {
                parsedTrip.days.push(dayObj);
              }
            }

            // 3. Parse 'Barangan...' sheet
            else if (lowerName.includes('barang') || lowerName.includes('checklist')) {
              rows.forEach(row => {
                const c0 = String(row[0] || '').trim();
                const c1 = String(row[1] || '').trim();
                const c2 = String(row[2] || '').trim();
                const c3 = String(row[3] || '').trim();

                if (c0.toLowerCase().includes('bil') || !c1) return;
                parsedTrip.items.push({
                  id: 'itm-' + parsedTrip.items.length + '-' + Date.now(),
                  no: parsedTrip.items.length + 1,
                  name: c1,
                  pic: c2,
                  comment: c3,
                  checked: false
                });
              });
            }
          });

          if (parsedTrip.riders.length === 0 && parsedTrip.days.length === 0 && parsedTrip.items.length === 0) {
            showToast("Format tab Excel tidak dikenali. Pastikan ada tab Ahli / Day1 / Barangan.", "error");
            return;
          }

          savedTrips[newTripId] = parsedTrip;
          activeTripId = newTripId;
          selectedDayIndex = 0;
          saveState();
          switchTab('ringkasan');
          showToast(`Fail "${file.name}" berjaya dimuat naik!`);
        } catch (err) {
          console.error(err);
          showToast("Ralat membaca fail Excel. Pastikan fail .xlsx sah.", "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function switchSavedTrip(tripId) {
      if (savedTrips[tripId]) {
        activeTripId = tripId;
        selectedDayIndex = 0;
        saveState();
        render();
        showToast(`Bertukar ke: ${savedTrips[tripId].title}`);
      }
    }

    function deleteSavedTrip(tripId) {
      if (tripId === DEFAULT_TRIP_DATA.id) return;
      delete savedTrips[tripId];
      if (activeTripId === tripId) {
        activeTripId = DEFAULT_TRIP_DATA.id;
      }
      saveState();
      render();
      showToast("Rekod konvoi dipadam.", "warning");
    }

    function exportJsonBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedTrips, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `konvoi_backup_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
      showToast("Fail backup JSON dimuat turun!");
    }

    function importJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && typeof imported === 'object') {
            savedTrips = { ...savedTrips, ...imported };
            activeTripId = Object.keys(imported)[0] || activeTripId;
            saveState();
            render();
            showToast("Data JSON berjaya dipulihkan!");
          }
        } catch (err) {
          showToast("Fail JSON tidak sah.", "error");
        }
      };
      reader.readAsText(file);
    }

    function confirmResetDefault() {
      openModal(`
        <h3 class="text-base font-extrabold text-white">Reset Data Asal?</h3>
        <p class="text-xs text-slate-400 leading-relaxed">Semua tanda check-in, bayaran, dan edit pada konvoi Pulau Pinang Dis 2026 akan dikembalikan kepada keadaan asal.</p>
        <div class="flex gap-2 pt-2">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Batal</button>
          <button onclick="executeResetDefault()" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-xs font-extrabold">Ya, Reset</button>
        </div>
      `);
    }

    function executeResetDefault() {
      savedTrips[DEFAULT_TRIP_DATA.id] = JSON.parse(JSON.stringify(DEFAULT_TRIP_DATA));
      activeTripId = DEFAULT_TRIP_DATA.id;
      selectedDayIndex = 0;
      saveState();
      closeModal();
      render();
      showToast("Data asal dikembalikan!");
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      switchTab('ringkasan');
    });
  </script>
</body>
