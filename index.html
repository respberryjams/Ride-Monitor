<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Konvoi Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: highway-sign top bar (green, white lettering, yellow marker) over a quiet working area of tabbed panels.
   Colour: expressway green, road-marking yellow, signal amber/red for fuel warnings. Type: Barlow Condensed (signage) + Barlow. */
:root {
  --bg: #edf0ec; --surface: #ffffff; --ink: #13211a; --mute: #55665c; --line: #d3dad4;
  --bar: #0b5d3b; --on-bar: #ffffff; --sign: #f2b705; --accent: #0b5d3b; --accent-soft: #dcebe2;
  --amber: #8a5a00; --amber-soft: #fbefc8; --red: #b3261e; --red-soft: #f9dcd8; --ok: #1f7a4d; --track: #e2e8e3;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1511; --surface: #16201a; --ink: #e5eee8; --mute: #93a69a; --line: #28362d;
  --bar: #0a3a27; --on-bar: #ffffff; --sign: #f2b705; --accent: #4cc38b; --accent-soft: #183326;
  --amber: #f0c04a; --amber-soft: #3a2f10; --red: #ff8a80; --red-soft: #3d1a17; --ok: #4cc38b; --track: #253229; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #16201a; --ink: #e5eee8; --mute: #93a69a; --line: #28362d;
  --bar: #0a3a27; --on-bar: #ffffff; --sign: #f2b705; --accent: #4cc38b; --accent-soft: #183326;
  --amber: #f0c04a; --amber-soft: #3a2f10; --red: #ff8a80; --red-soft: #3d1a17; --ok: #4cc38b; --track: #253229; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
.wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bar); color: var(--on-bar); }
.bar-top { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.shield { flex: none; width: 34px; height: 38px; }
.brand h1 { font-size: 1.5rem; line-height: 1; text-transform: uppercase; }
.brand small { display: block; font-family: var(--body); font-size: .75rem; opacity: .8; margin-top: 2px; }
.trip-select { background: rgba(255,255,255,.12); color: var(--on-bar); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 7px 10px; font: inherit; max-width: 100%; }
.trip-select option { color: #13211a; background: #fff; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; font-weight: 600; }
.btn.sign { background: var(--sign); color: #1b1500; border-color: var(--sign); }
.btn.sm { padding: 5px 10px; font-size: .875rem; }
.btn.danger { color: var(--red); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; color: var(--on-bar); opacity: .75; padding: 10px 14px 9px; font-family: var(--display); font-size: 1.15rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-bottom: 4px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--sign); }

main { padding-block: 20px 56px; display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel > h2 { font-size: 1.35rem; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.muted { color: var(--mute); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.sign { background: var(--sign); color: #1b1500; }

/* hero */
.hero { background: var(--bar); color: var(--on-bar); border-radius: 8px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-items: center; }
.hero .count { font-family: var(--display); font-weight: 700; font-size: clamp(3.5rem, 14vw, 5.5rem); line-height: .9; font-variant-numeric: tabular-nums; }
.hero .count-label { font-family: var(--display); font-size: 1.25rem; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
.hero .next { border-left: 3px solid var(--sign); padding-left: 16px; min-width: 0; }
.hero .next .k { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.hero .next .t { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
.hero .next .a { overflow-wrap: anywhere; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .hero .next { border-left: 0; border-top: 3px solid var(--sign); padding: 12px 0 0; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.stat b { font-family: var(--display); font-size: 2rem; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.list li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* progress */
.meter { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter.amber i { background: #d99a00; } .meter.red i { background: var(--red); }

/* schedule */
.daytabs { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #04160d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #04160d; } }
.dayhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dayhead h2 { font-size: 1.7rem; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.tl { list-style: none; margin: 14px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 64px 22px minmax(0, 1fr); gap: 0 10px; padding: 10px 8px; border-radius: 6px; }
.tl li + li { border-top: 1px solid var(--line); }
.tl .time { font-family: var(--display); font-size: 1.45rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tl .act { overflow-wrap: anywhere; font-weight: 500; }
.tl .note { white-space: pre-line; overflow-wrap: anywhere; color: var(--mute); font-size: .9rem; }
.tl .alt { font-size: .9rem; color: var(--mute); }
.tl li.done .act { text-decoration: line-through; color: var(--mute); }
.tl li.now { background: var(--amber-soft); }
.tl li.fuel .time::after { content: " ⛽"; font-size: 1rem; }
.tick { width: 22px; height: 22px; accent-color: var(--accent); margin: 2px 0 0; cursor: pointer; }

/* fuel */
.leg { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 90px; gap: 6px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.leg:first-of-type { border-top: 0; }
.leg .where { overflow-wrap: anywhere; font-size: .95rem; }
.leg .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.leg.reset .where::before { content: "⛽ "; }
@media (max-width: 520px) { .leg { grid-template-columns: minmax(0, 1fr) 80px; } .leg .meter { grid-column: 1 / -1; order: 3; } }

/* members */
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.member { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 6px; background: var(--surface); min-width: 0; }
.member h3 { font-size: 1.5rem; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.member .fuelnote { font-size: .875rem; color: var(--mute); overflow-wrap: anywhere; }

/* packing */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pack { list-style: none; margin: 0; padding: 0; }
.pack li { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(110px, 200px); gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pack li.done .it { text-decoration: line-through; color: var(--mute); }
.pack .it { overflow-wrap: anywhere; }
.pack input[type=text] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
@media (max-width: 520px) { .pack li { grid-template-columns: 26px minmax(0, 1fr); } .pack li input[type=text] { grid-column: 2; } }

.ed { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
textarea.ed { resize: vertical; min-height: 56px; }
.bar .btn:not(.sign) { background: rgba(255,255,255,.12); color: var(--on-bar); border-color: rgba(255,255,255,.35); }
.btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--sign); color: #1b1500; border-color: var(--sign); }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 8px; padding: 10px 14px; font-weight: 500; }
.elist { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.erow { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; grid-template-columns: 120px minmax(0, 1fr); align-items: end; }
.erow .full, .erow .rowact { grid-column: 1 / -1; }
.rowact { display: flex; justify-content: flex-end; }
@media (max-width: 520px) { .erow { grid-template-columns: 1fr; } }
.field { display: grid; gap: 3px; min-width: 0; }
.field > span { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.pack.edit li { grid-template-columns: 26px minmax(0, 1fr) minmax(110px, 200px) auto; align-items: start; }
.pack.edit .it { display: grid; gap: 6px; }
@media (max-width: 620px) { .pack.edit li { grid-template-columns: 26px minmax(0, 1fr); } .pack.edit li > * { grid-column: 2; } .pack.edit li > .tick { grid-column: 1; grid-row: 1; } }
.pack .it input[type=text] { grid-column: auto !important; }
.addbar { margin-top: 14px; }
.toast button { margin-left: 12px; background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 2px 10px; }
.shortcuts { margin-top: 8px; }
/* mobile app look */
.bar .tabs { display: none; }
main { padding-bottom: 110px; }
.toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.bnav { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.08);
  padding: 6px max(6px, calc((100% - 980px) / 2), env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, calc((100% - 980px) / 2), env(safe-area-inset-left, 0px)); }
.bnav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; color: var(--mute); font-size: .72rem; font-weight: 600; letter-spacing: .02em; min-width: 0; border-radius: 12px; }
.bnav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bnav button[aria-current="page"] { color: var(--accent); }
.bnav button[aria-current="page"] .ico { background: var(--accent-soft); }
.bnav .ico { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.bnav button:hover { color: var(--ink); }
@media (max-width: 720px) {
  html { -webkit-tap-highlight-color: transparent; }
  body { overscroll-behavior-y: none; font-size: 17px; }
  .bar-top { padding-block: 10px; gap: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .bar-top .brand { order: 1; margin: 0; }
  #btnEdit { order: 2; }
  .trip-select { order: 3; width: 100%; }
  #btnImport { order: 4; }
  .brand h1 { font-size: 1.35rem; }
  .brand small { font-size: .72rem; }
  .shield { width: 28px; height: 32px; }
  .bar .tabs { display: none; }
  .trip-select { flex: 1; min-width: 0; min-height: 44px; font-size: 16px; border-radius: 10px; }
  .bar .btn { min-height: 44px; border-radius: 10px; }
  main { padding-block: 14px 110px; gap: 14px; }
  .panel { border-radius: 16px; padding: 16px; border-color: transparent; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05); }
  .hero { border-radius: 20px; padding: 22px 20px; }
  .stat { border-radius: 14px; border-color: transparent; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .btn, .chip { min-height: 44px; }
  .btn.sm { min-height: 40px; padding: 8px 14px; }
  .chip { padding: 8px 16px; }
  .daytabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .daytabs::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; flex: none; }
  .tick { width: 28px; height: 28px; }
  .tl li { grid-template-columns: 58px 28px minmax(0, 1fr); padding: 12px 6px; }
  .tl .time { font-size: 1.5rem; }
  .pack li { grid-template-columns: 30px minmax(0, 1fr); padding: 12px 0; }
  .member { border-radius: 14px; }
  .ed, .pack input[type=text], select { font-size: 16px; min-height: 44px; border-radius: 10px; }
  textarea.ed { min-height: 80px; }
  .btn:active, .chip:active, .bnav a:active, .bnav button:active { transform: scale(.97); }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .bnav { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.08);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .bnav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; color: var(--mute); font-size: .68rem; font-weight: 600; letter-spacing: .02em; min-width: 0; border-radius: 12px; }
  .bnav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bnav button[aria-current="page"] { color: var(--accent); }
  .bnav button[aria-current="page"] .ico { background: var(--accent-soft); }
  .bnav .ico { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
}
/* files */
.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.tripitem { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.tripitem:first-child { border-top: 0; }
.tripitem .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
table.fmt { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.fmt th, table.fmt td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.empty { padding: 18px 0; color: var(--mute); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: min(92vw, 520px); z-index: 20; font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .25s; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Pure parser: sheets = { sheetName: rows[][] } -> trip object */
function parseTrip(sheets, fileName) {
  var MONTHS = { jan:0, januari:0, january:0, feb:1, februari:1, february:1, mac:2, mar:2, march:2, apr:3, april:3,
    mei:4, may:4, jun:5, june:5, julai:6, jul:6, july:6, ogos:7, ogo:7, aug:7, august:7, sep:8, sept:8, september:8,
    okt:9, oktober:9, oct:9, october:9, nov:10, november:10, dis:11, disember:11, dec:11, december:11 };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var s = function (v) { return v == null ? '' : String(v).trim(); };
  var low = function (v) { return s(v).toLowerCase(); };

  function timeStr(v) {
    if (typeof v === 'number' && v >= 0 && v < 1.0001) {
      var m = Math.round(v * 1440) % 1440;
      return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
    }
    if (v instanceof Date) return pad(v.getHours()) + ':' + pad(v.getMinutes());
    var t = s(v).match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);
    if (t) {
      var h = +t[1];
      if (t[3] && /pm/i.test(t[3]) && h < 12) h += 12;
      if (t[3] && /am/i.test(t[3]) && h === 12) h = 0;
      return pad(h) + ':' + t[2];
    }
    return '';
  }
  function parseDate(txt) {
    var m = s(txt).match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
    if (!m) return '';
    var mo = MONTHS[m[2].toLowerCase()];
    if (mo == null) return '';
    return m[3] + '-' + pad(mo + 1) + '-' + pad(+m[1]);
  }
  function findHeader(rows, test) {
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i] || [];
      for (var j = 0; j < r.length; j++) if (test(low(r[j]), r)) return i;
    }
    return -1;
  }
  function colOf(row, re) {
    for (var j = 0; j < row.length; j++) if (re.test(low(row[j]))) return j;
    return -1;
  }

  function fld(label, html) { return '<label class="field"><span>' + label + '</span>' + html + '</label>'; }

    } else {
      hero = '<div><div class="count">' + days.length + '</div><div class="count-label">days</div></div><div class="next"><div class="t">' + esc(t.name) + '</div><div class="a muted">No dates detected in the sheets.</div></div>';
    }

    var stats = '<div class="stats">' +

    var att = [];
    var pending = t.pack.map(function (p) { return { p: p, i: p.uid }; }).filter(function (x) { return !S.state[key('p', x.i)] && (isMust(x.p.note) || isMust(x.p.who)); });
    pending.forEach(function (x) { att.push(['red', 'Must', x.p.item + (x.p.who ? ' · ' + x.p.who : '') + ' is not packed yet']); });
    var noWho = t.pack.filter(function (p) { return !(S.state[key('w', p.uid)] != null ? S.state[key('w', p.uid)] : p.who) && !S.state[key('p', p.uid)]; }).length;
    if (noWho) att.push(['amber', 'Carrier', noWho + ' items have no carrier yet']);
    days.forEach(function (d) { analyze(d, lim && lim.range).forEach(function (a) { var lv = level(a.ratio); if (lv) att.push([lv, 'Fuel', d.label + ': ' + a.cum + ' km before refuelling at ' + shortAct(a.act) + ' (' + Math.round(a.ratio * 100) + '% of ' + lim.name + "'s range)"]); }); });
    t.members.filter(function (m) { return !m.range; }).forEach(function (m) { att.push(['amber', 'Rider', m.name + ' has no tank range' + (m.bike ? '' : ' / no bike')]); });

    var notes = t.notes.concat(t.packNotes);

    } else if (notes.length) {

    }

    return (S.edit ? '<section class="panel"><h2>File name</h2>' + inp('trip', 'x', 'name', t.name, 'File name') + '</section>' : '') + '<section class="hero">' + hero + '</section>' + stats +

  function liveInfo(t) {
    var days = t.days.filter(function (d) { return d.date; });
    if (!days.length) return { mode: 'none' };
    var today = isoToday();
    var d = days.filter(function (x) { return x.date === today; })[0];
    if (d) {
      var m = mins(d.rows), n = new Date(), nowM = n.getHours() * 60 + n.getMinutes(), cur = 0;
      m.forEach(function (v, i) { if (v != null && v <= nowM) cur = i; });
      return { mode: 'live', day: d, cur: cur };
    }
    var diff = dayDiff(days[0].date);
    if (diff > 0) return { mode: 'before', n: diff };
    if (dayDiff(days[days.length - 1].date) < 0) return { mode: 'after' };
    return { mode: 'none' };
  }

  /* ---------- import ---------- */
  var toastT;
  function toast(msg, undo) {
    var el = $('toast'); el.textContent = msg; el.hidden = false;
    if (undo) { var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Undo'; b.onclick = function () { el.hidden = true; undo(); }; el.appendChild(b); }
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, undo ? 8000 : 5000);
  }
  function importFile(file) {
    if (!file) return;
    if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)) { toast('The file must be .xlsx.'); return; }
    if (!window.XLSX) { toast('The Excel reader failed to load. Check your connection and try again.'); return; }
    var fr = new FileReader();
    fr.onerror = function () { toast('The file could not be read.'); };
    fr.onload = function () {
      try {
        var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' }), sheets = {};
        wb.SheetNames.forEach(function (n) { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }); });
        var data = ensureIds(parseTrip(sheets, file.name));
        if (!data.days.length && !data.members.length && !data.pack.length) { toast('No recognised sheets. See the Files tab for the format.'); return; }
        var id = 't' + Date.now().toString(36);
        var rec = { id: id, name: data.name, data: data };
        S.imported.push(rec); saveTrips();
        if (S.dbOn) S.db.collection('trips').doc(id).set({ name: rec.name, json: JSON.stringify(data) }).catch(function () {});
        S.tripId = id; S.day = null; store.set('konvoi.trip', id); S.tab = 'summary'; location.hash = 'summary';
        render();
        toast(data.name + ': ' + data.days.length + ' days, ' + data.members.length + ' riders, ' + data.pack.length + ' items.' + (data.warnings.length ? ' ' + data.warnings.join(' ') : ''));
      } catch (e) { toast('The file could not be read as Excel.'); }
    };
    fr.readAsArrayBuffer(file);
  }
  function wireDrop() {
    var d = $('drop'); if (!d) return;
    d.ondragover = function (e) { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = function () { d.classList.remove('over'); };
    d.ondrop = function (e) { e.preventDefault(); d.classList.remove('over'); importFile(e.dataTransfer.files[0]); };
  }
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]); });

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab],[data-day],[data-filter],[data-pick],[data-open],[data-del],[data-delyes],[data-delno],[data-add],[data-rm],[data-resetedit],#btnEdit,#btnImport');
    if (!b) return;
    var d = b.dataset;
    if (b.id === 'btnEdit') { S.edit = !S.edit; render(); return; }
    if (d.resetedit) { delete S.edits.dec2026; store.set('konvoi.edits', JSON.stringify(S.edits)); if (S.dbOn) S.db.collection('edits').doc('dec2026').delete().catch(fail); render(); toast('Restored to the original file.'); return; }
    if (d.add) {
      mutate(function (x) {
        if (d.add === 'pack') x.pack.push({ uid: nextUid(x.pack), item: 'New item', who: '', note: '' });
        else if (d.add === 'mem') x.members.push({ uid: nextUid(x.members), name: 'New rider', bike: '', pillion: '', fuel: '', range: 0 });
        else if (d.add === 'note') { x.notes = x.notes.concat(x.packNotes); x.packNotes = []; x.notes.push('New note'); }
        else if (d.add === 'row') { var dy = findDay(x, d.did); dy.rows.push({ uid: nextUid(dy.rows), t: '', act: 'New activity', alt: '', note: '', loc: '' }); }
        else if (d.add === 'day') { var n = x.days.reduce(function (m, y) { return Math.max(m, +y.id.slice(1)); }, 0) + 1; x.days.push({ id: 'd' + n, name: '', label: 'Day ' + n, sub: '', date: '', title: '', stay: '', gmap: '', waze: '', rows: [] }); S.day = 'd' + n; }
      }, true);
      return;
    }
    if (d.rm) {
      mutate(function (x) {
        var keep = function (arr) { return arr.filter(function (y) { return String(y.uid) !== d.id; }); };
        if (d.rm === 'pack') x.pack = keep(x.pack);
        else if (d.rm === 'mem') x.members = keep(x.members);
        else if (d.rm === 'note') { x.notes = x.notes.concat(x.packNotes); x.packNotes = []; x.notes.splice(+d.id, 1); }
        else if (d.rm === 'row') { var dy = findDay(x, d.did); dy.rows = keep(dy.rows); }
        else if (d.rm === 'day') { x.days = x.days.filter(function (y) { return y.id !== d.id; }); S.day = null; }
      }, true, 'Deleted.');
      return;
    }
    if (b.id === 'btnImport' || d.pick) { $('fileIn').click(); return; }
    if (d.tab) { S.tab = d.tab; store.set('konvoi.tab', S.tab); location.hash = S.tab; window.scrollTo(0, 0); }
    else if (d.day) S.day = d.day;
    else if (d.filter) S.filter = d.filter;
    else if (d.open) { S.tripId = d.open; S.day = null; store.set('konvoi.trip', S.tripId); }
    else if (d.del) S.confirmDel = d.del;
    else if (d.delno) S.confirmDel = null;
    else if (d.delyes) {
      S.imported = S.imported.filter(function (x) { return x.id !== d.delyes; }); saveTrips();
      if (S.dbOn) S.db.collection('trips').doc(d.delyes).delete().catch(function () {});
      if (S.tripId === d.delyes) S.tripId = 'dec2026'; S.confirmDel = null;
    }
    render();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'fileIn') { importFile(el.files[0]); el.value = ''; return; }
    if (el.id === 'tripSel') { S.tripId = el.value; S.day = null; store.set('konvoi.trip', S.tripId); render(); return; }
    if (el.dataset.done) { var p = el.dataset.done.split('_'); setState(key('d', p[0], p[1]), el.checked); render(); }
    else if (el.dataset.pack != null && el.dataset.pack !== '') { setState(key('p', el.dataset.pack), el.checked); render(); }
    else if (el.dataset.ed) {
      var k = el.dataset.ed, id = el.dataset.id, f = el.dataset.f, v = el.value;
      mutate(function (x) {
        if (k === 'trip') x.name = v.trim() || x.name;
        else if (k === 'pack') { var p = byUid(x.pack, id); if (p) p[f] = v.trim(); if (f === 'who') setState(key('w', id), ''); }
        else if (k === 'row') { var r = byUid(findDay(x, el.dataset.did).rows, id); if (r) r[f] = f === 'note' ? v : v.trim(); }
        else if (k === 'mem') { var m = byUid(x.members, id); if (m) { if (f === 'range') m.range = Math.max(0, parseInt(v, 10) || 0); else m[f] = v.trim(); } }
        else if (k === 'day') { var dd = findDay(x, id); if (dd) dd[f] = v.trim(); }
        else if (k === 'note') { x.notes = x.notes.concat(x.packNotes); x.packNotes = []; x.notes[+id] = v.trim(); }
      }, false);
    }
  });
  window.addEventListener('hashchange', function () { var x = location.hash.slice(1); if (VIEWS[x] && x !== S.tab) { S.tab = x; render(); } });

  /* ---------- shared store (optional) ---------- */
  render();
  setInterval(function () { if (S.tab === 'summary' || S.tab === 'schedule') rerenderSoft(); }, 60000);

  (function connect() {
    if (!window.claude || !claude.use) return;
    var timer = setTimeout(function () {}, 10000);
    claude.use('db').then(function (db) {
      clearTimeout(timer);
      if (!db) return;
      S.db = db; S.dbOn = true;
      db.collection('state').onSnapshot(function (snap) {
        var remote = {};
        snap.docs.forEach(function (d) { var x = d.data(); if (x && x.v != null) remote[d.id] = x.v; });
        var merged = Object.assign({}, S.state);
        Object.keys(remote).forEach(function (k) { merged[k] = remote[k]; });
        snap.docChanges().forEach(function (c) { if (c.type === 'removed') delete merged[c.doc.id]; });
        S.state = merged; store.set('konvoi.state', JSON.stringify(S.state)); rerenderSoft();
      }, function () {});
      db.collection('trips').onSnapshot(function (snap) {
        var changed = false;
        snap.docs.forEach(function (d) {
          var x = d.data(); if (!x || !x.json) return;
          var cur = S.imported.filter(function (y) { return y.id === d.id; })[0];
          if (cur && JSON.stringify(cur.data) === x.json) return;
          try {
            var data = ensureIds(JSON.parse(x.json));
            if (cur) { cur.data = data; cur.name = data.name; } else S.imported.push({ id: d.id, name: x.name, data: data });
            changed = true;
          } catch (e) {}
        });
        if (changed) { saveTrips(); rerenderSoft(); }
      }, function () {});
      db.collection('edits').onSnapshot(function (snap) {
        var changed = false;
        snap.docs.forEach(function (d) {
          var x = d.data(); if (!x || !x.json) return;
          if (S.edits[d.id] && JSON.stringify(S.edits[d.id]) === x.json) return;
          try { S.edits[d.id] = ensureIds(JSON.parse(x.json)); changed = true; } catch (e) {}
        });
        snap.docChanges().forEach(function (c) { if (c.type === 'removed' && S.edits[c.doc.id]) { delete S.edits[c.doc.id]; changed = true; } });
        if (changed) { store.set('konvoi.edits', JSON.stringify(S.edits)); rerenderSoft(); }
      }, function () {});
    }).catch(function () {});
  })();
})();
</script>
