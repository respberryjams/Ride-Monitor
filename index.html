<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6b1e3a">
  <title>Tripcrew</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f2ef; --surface: #fffdfc; --ink: #2b1d22; --mute: #7a6770; --line: #eadfdb;
      --bar: #6b1e3a; --on-bar: #fff7f2; --sign: #d9a441; --accent: #8c2a4b; --accent-soft: #f6e3e8;
      --amber: #86570a; --amber-soft: #fbefd3; --red: #b3261e; --red-soft: #f9dcd8; --ok: #2f7a55; --track: #eddfe0;
      --display: "Fraunces", Georgia, "Times New Roman", serif;
      --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1317; --surface: #281c22; --ink: #f4e8ea; --mute: #b9a0a8; --line: #3d2b32;
        --bar: #4a1428; --on-bar: #fff7f2; --sign: #d9a441; --accent: #e58aa5; --accent-soft: #3d1f2b;
        --amber: #f0c04a; --amber-soft: #3a2f10; --red: #ff8a80; --red-soft: #3d1a17; --ok: #7cc79f; --track: #3a2830;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1c1317; --surface: #281c22; --ink: #f4e8ea; --mute: #b9a0a8; --line: #3d2b32;
      --bar: #4a1428; --on-bar: #fff7f2; --sign: #d9a441; --accent: #e58aa5; --accent-soft: #3d1f2b;
      --amber: #f0c04a; --amber-soft: #3a2f10; --red: #ff8a80; --red-soft: #3d1a17; --ok: #7cc79f; --track: #3a2830;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); -webkit-text-size-adjust: 100%; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; overflow-x: clip; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
    img { max-width: 100%; }
    [hidden]:not([hidden="until-found" i]) { display: none !important; }
    h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: 0; text-wrap: balance; }
    a { color: var(--accent); }
    button, a, select, input, textarea { touch-action: manipulation; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
    .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

    /* top bar */
    .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bar); color: var(--on-bar); box-shadow: 0 4px 16px rgba(0,0,0,.14); }
    .bar-top { display: flex; align-items: center; gap: 8px; padding-block: 10px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
    .shield { flex: none; width: 38px; height: 38px; }
    .brand h1 { font-size: 1.5rem; line-height: 1; text-transform: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .brand small { display: block; font-family: var(--body); font-size: .75rem; opacity: .88; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
    .sync-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--body); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: rgba(47,122,85,.35); color: #a7f3d0; border: 1px solid rgba(167,243,208,.4); vertical-align: middle; }
    .sync-badge.local { background: rgba(255,255,255,.15); color: #fde68a; border-color: rgba(253,230,138,.4); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; display: inline-block; }
    .sync-badge.local .sync-dot { background: #fbbf24; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
    .sync-badge:not(.local) .sync-dot { animation: pulseDot 2s infinite; }

    .trip-select { background: rgba(255,255,255,.12); color: var(--on-bar); border: 1px solid rgba(255,255,255,.35); border-radius: 99px; padding: 7px 12px; font: inherit; max-width: 100%; }
    .trip-select option { color: #13211a; background: #fff; }
    .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
    .btn.sign { background: var(--sign); color: #1b1500; border-color: var(--sign); }
    .btn.sm { padding: 6px 12px; font-size: .85rem; }
    .btn.danger { color: var(--red); }
    .bar .btn:not(.sign) { background: rgba(255,255,255,.12); color: var(--on-bar); border-color: rgba(255,255,255,.35); padding-inline: 12px; }
    .btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--sign); color: #1b1500; border-color: var(--sign); }
    .tabs { display: none; }

    main { padding-block: 16px 124px; display: grid; gap: 16px; min-width: 0; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; box-shadow: 0 1px 2px rgba(70,20,40,.06), 0 10px 28px rgba(70,20,40,.05); }
    .panel > h2 { font-size: 1.45rem; margin-bottom: 10px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
    .muted { color: var(--mute); }
    .small { font-size: .875rem; }
    .num { font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .pill.ok { background: #e1f3ea; color: var(--ok); }
    .pill.sign { background: var(--sign); color: #1b1500; }

    /* hero */
    .hero { position: relative; background: var(--bar); color: var(--on-bar); border-radius: 22px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-items: center; box-shadow: 0 10px 28px rgba(70,20,40,.18); }
    .hero::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(217,164,65,.6); border-radius: 15px; pointer-events: none; }
    .hero .count { font-family: var(--display); font-weight: 600; font-style: italic; font-size: clamp(3.2rem, 13vw, 5.2rem); line-height: .92; font-variant-numeric: tabular-nums; }
    .hero .count-label { font-family: var(--body); font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
    .hero .next { border-left: 3px solid var(--sign); padding-left: 16px; min-width: 0; }
    .hero .next .k { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
    .hero .next .t { font-family: var(--display); font-size: 1.8rem; font-weight: 600; line-height: 1.15; }
    .hero .next .a { overflow-wrap: anywhere; }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .hero .next { border-left: 0; border-top: 3px solid var(--sign); padding: 12px 0 0; } }

    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 600px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } }
    .stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 1px 2px rgba(70,20,40,.05); min-width: 0; }
    .stat b { font-family: var(--display); font-weight: 600; font-size: 1.85rem; line-height: 1.05; display: block; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat span { font-size: .76rem; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .list li { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
    .list li:first-child { border-top: 0; }
    .list .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }

    /* progress */
    .meter { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
    .meter.amber i { background: #d99a00; } .meter.red i { background: var(--red); }

    /* schedule */
    .daytabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    :root[data-theme="dark"] .chip[aria-pressed="true"] { color: #2a0f19; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #2a0f19; } }
    .dayhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .dayhead h2 { font-size: 1.65rem; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .tl { list-style: none; margin: 14px 0 0; padding: 0; }
    .tl li { display: grid; grid-template-columns: 60px 26px minmax(0, 1fr); gap: 4px 10px; padding: 12px 8px; border-radius: 10px; align-items: start; }
    .tl li + li { border-top: 1px solid var(--line); }
    .tl .time { font-family: var(--display); font-size: 1.4rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tl .act { overflow-wrap: anywhere; font-weight: 500; }
    .tl .note { white-space: pre-line; overflow-wrap: anywhere; color: var(--mute); font-size: .9rem; margin-top: 2px; }
    .tl .alt { font-size: .9rem; color: var(--mute); margin-top: 2px; }
    .tl li.done .act { text-decoration: line-through; color: var(--mute); }
    .tl li.now { background: var(--amber-soft); }
    .tl li.fuel .time::after { content: " ⛽"; font-size: .95rem; }
    .tick { width: 24px; height: 24px; accent-color: var(--accent); margin: 1px 0 0; cursor: pointer; }

    /* fuel */
    .leg { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 90px; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
    .leg:first-of-type { border-top: 0; }
    .leg .where { overflow-wrap: anywhere; font-size: .95rem; }
    .leg .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .leg.reset .where::before { content: "⛽ "; }
    @media (max-width: 520px) { .leg { grid-template-columns: minmax(0, 1fr) 82px; } .leg .meter { grid-column: 1 / -1; order: 3; } }

    /* members */
    .members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
    .member { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 6px; background: var(--surface); min-width: 0; }
    .member h3 { font-size: 1.4rem; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .member .fuelnote { font-size: .875rem; color: var(--mute); overflow-wrap: anywhere; }
    .lim-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--amber-soft); color: var(--amber); padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; }
    .lim-bar select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font: inherit; font-weight: 600; max-width: 100%; }

    /* packing */
    .who-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--accent-soft); color: var(--ink); padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; }
    .who-bar select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font: inherit; font-weight: 600; max-width: 100%; }
    .who-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pack { list-style: none; margin: 0; padding: 0; }
    .pack li { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(120px, 200px); gap: 6px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
    .pack li.done .it > span { text-decoration: line-through; color: var(--mute); }
    .pack .it { overflow-wrap: anywhere; min-width: 0; }
    .pack input[type=text] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-width: 0; }
    @media (max-width: 560px) {
      .pack li { grid-template-columns: 28px minmax(0, 1fr); gap: 6px 10px; padding: 12px 0; }
      .pack li > input[type=text] { grid-column: 2; }
    }

    .ed { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-width: 0; }
    textarea.ed { resize: vertical; min-height: 64px; }
    .banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
    .elist { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
    .erow { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; grid-template-columns: 130px minmax(0, 1fr); align-items: end; background: var(--bg); }
    .erow .full, .erow .rowact { grid-column: 1 / -1; }
    .rowact { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 560px) { .erow { grid-template-columns: 1fr; } }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field > span { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
    .pack.edit li { grid-template-columns: 28px minmax(0, 1fr) minmax(120px, 200px) auto; align-items: start; }
    .pack.edit .it { display: grid; gap: 6px; }
    @media (max-width: 620px) {
      .pack.edit li { grid-template-columns: 28px minmax(0, 1fr); }
      .pack.edit li > * { grid-column: 2; }
      .pack.edit li > .tick { grid-column: 1; grid-row: 1; }
      .pack.edit li > .btn.danger { justify-self: end; }
    }
    .pack .it input[type=text] { grid-column: auto !important; }
    .addbar { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .toast button { margin-left: 12px; background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 3px 10px; }
    .shortcuts { margin-top: 8px; }

    /* bottom nav */
    .bnav { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.08);
      padding: 6px max(4px, calc((100% - 980px) / 2), env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, calc((100% - 980px) / 2), env(safe-area-inset-left, 0px)); }
    .bnav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 5px 2px 4px; color: var(--mute); font-size: .7rem; font-weight: 600; letter-spacing: .01em; min-width: 0; border-radius: 12px; }
    .bnav button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .bnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .bnav button[aria-current="page"] { color: var(--accent); }
    .bnav button[aria-current="page"] .ico { background: var(--accent-soft); }
    .bnav .ico { width: 46px; height: 28px; border-radius: 14px; display: grid; place-items: center; }
    .bnav button:hover { color: var(--ink); }

    @media (max-width: 720px) {
      html { -webkit-tap-highlight-color: transparent; }
      body { overscroll-behavior-y: none; font-size: 16.5px; }
      .bar-top { padding-block: 10px; gap: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; }
      .bar-top .brand { grid-column: 1; margin: 0; }
      .brand small { max-width: 100%; }
      #btnSyncNow { grid-column: 2; padding-inline: 10px; }
      #btnShareLink { grid-column: 3; padding-inline: 10px; }
      #btnEdit { grid-column: 4; padding-inline: 10px; }
      .trip-select { grid-column: 1 / -1; width: 100%; min-height: 44px; font-size: 16px; border-radius: 12px; }
      .top-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .brand h1 { font-size: 1.25rem; }
      .brand small { font-size: .72rem; }
      .shield { width: 32px; height: 32px; }
      .bar .btn { min-height: 40px; border-radius: 12px; font-size: .85rem; }
      main { padding-block: 14px 124px; gap: 14px; }
      .panel { border-radius: 16px; padding: 15px; }
      .hero { border-radius: 20px; padding: 20px 18px; }
      .stat { border-radius: 14px; }
      .btn, .chip { min-height: 44px; }
      .btn.sm { min-height: 38px; padding: 6px 12px; }
      .chip { padding: 8px 16px; }
      .daytabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -15px; padding-inline: 15px; -webkit-overflow-scrolling: touch; }
      .daytabs::-webkit-scrollbar { display: none; }
      .chip { white-space: nowrap; flex: none; }
      .tick { width: 28px; height: 28px; }
      .tl li { grid-template-columns: 56px 28px minmax(0, 1fr); padding: 12px 6px; }
      .tl .time { font-size: 1.45rem; }
      .member { border-radius: 14px; }
      .ed, .pack input[type=text], select { font-size: 16px; min-height: 44px; border-radius: 10px; }
      textarea.ed { min-height: 80px; }
      .btn:active, .chip:active, .bnav button:active { transform: scale(.97); }
      .bnav button { font-size: .66rem; }
      .quick-actions { display: grid !important; grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 721px) {
      .top-actions { display: flex; gap: 8px; }
      .brand small { max-width: 460px; }
    }

    /* files */
    .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 24px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; }
    .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .tripitem { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); }
    .tripitem:first-child { border-top: 0; }
    .tripitem .grow { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
    table.fmt { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.fmt th, table.fmt td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .empty { padding: 18px 0; color: var(--mute); }

    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: min(92vw, 520px); z-index: 20; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.25); overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: no-preference) { .meter i { transition: width .25s; } }
  </style>
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <div class="bar-top">
        <div class="brand">
          <svg class="shield" viewBox="0 0 36 36" aria-hidden="true">
            <rect width="36" height="36" rx="10" fill="#d9a441"/>
            <path d="M9 27C9 20 17 24 19 18.500 20 16 22 17.500 25 17.500" fill="none" stroke="#6b1e3a" stroke-width="2.600" stroke-linecap="round"/>
            <circle cx="9" cy="27" r="3" fill="#6b1e3a"/>
            <path d="M25 5a5.200 5.200 0 0 1 5.200 5.200c0 3.800-5.200 8.300-5.200 8.300s-5.200-4.500-5.200-8.300A5.200 5.200 0 0 1 25 5z" fill="#6b1e3a"/>
            <circle cx="25" cy="10.200" r="1.900" fill="#d9a441"/>
          </svg>
          <div>
            <h1>Tripcrew <span id="syncBadge" class="sync-badge local"><i class="sync-dot"></i><span id="syncBadgeTxt">Local</span></span></h1>
            <small id="subtitle"></small>
          </div>
        </div>

      function getLimiter(t) {
        var r = t.members.filter(function (m) { return m.range > 0; });
        if (!r.length) return null;
        var customUid = S.state[key('lim', 'uid')] != null ? S.state[key('lim', 'uid')] : t.limiterUid;
        if (customUid !== null && customUid !== '') {
          var found = r.filter(function (m) { return String(m.uid) === String(customUid); })[0];
          if (found) return found;
        }
        return r.reduce(function (a, b) { return b.range < a.range ? b : a; });
      }

      function isFuelStop(r) { return /isi minyak|top-?up minyak|minyak penuh|refuel|fill ?up|fuel up/i.test(r.act); }
      function isMust(txt) { return /wajib|must|mandatory/i.test(txt || ''); }
      function key(kind, a, b) { return S.tripId + '_' + kind + '_' + a + (b == null ? '' : '_' + b); }

      function analyze(day, limit) {
        var cum = 0, out = [];
        day.rows.forEach(function (r, i) {
          var m = r.note.match(/(\d+(?:[.,]\d+)?)\s*km/i);
          var km = m ? parseFloat(m[1].replace(',', '.')) : 0;
          cum += km;
          var fuel = isFuelStop(r);
          if (km || fuel) out.push({ i: i, act: r.act, t: r.t, km: km, cum: cum, fuel: fuel, ratio: limit ? cum / limit : 0 });
          if (fuel) cum = 0;
        });
        return out.filter(function (x) { return x.km > 0; });
      }
      function level(ratio) { return ratio >= 1 ? 'red' : ratio >= .75 ? 'amber' : ''; }
      function shortAct(a) { return a.replace(/\s*\(.*?\)\s*/g, ' ').split(/\s+(?:di|at)\s+/i).slice(-1)[0].split(',')[0].trim(); }

      /* ---------- Firebase Realtime Database sync (REST + live stream) ----------
         Struktur: rooms/<room>/state/<kunci>   -> setiap tick / carrier ada path sendiri
                   rooms/<room>/trips/<id>/...  -> meta, members, pack, days/<dayId> (JSON string)
                   rooms/<room>/meta/hideSample
         Changes are sent as per-path updates (PATCH), not by overwriting all data. */
      var R = {};                       // mirror of the room data from the server
      var seededKey = function () { return 'konvoi.seeded.' + roomId; };
      var outboxKey = function () { return 'konvoi.outbox.' + roomId; };
      function roomUrl() { return FIREBASE_URL + '/rooms/' + encodeURIComponent(roomId) + '.json'; }

      function fbKey(k) { return String(k).replace(/[%.$#\[\]\/\u0000-\u001f]/g, function (c) { return '%' + ('0' + c.charCodeAt(0).toString(16).toUpperCase()).slice(-2); }); }
      function unFbKey(k) { return String(k).replace(/%([0-9A-F]{2})/g, function (_m, h) { return String.fromCharCode(parseInt(h, 16)); }); }

      function setAt(root, path, val) {
        var parts = String(path).split('/').filter(Boolean);
        if (!parts.length) return;
        var o = root;
        for (var i = 0; i < parts.length - 1; i++) {
          if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
          o = o[parts[i]];
        }
        var last = parts[parts.length - 1];
        if (val === null || val === undefined) delete o[last]; else o[last] = val;
      }
      function joinPath(a, b) { return String(a).replace(/\/+$/, '') + '/' + String(b).replace(/^\/+/, ''); }
      function isEmptyObj(o) { return !o || typeof o !== 'object' || !Object.keys(o).length; }

      function loadOutbox() {
        try { S.outbox = JSON.parse(store.get(outboxKey()) || '{}') || {}; } catch (e) { S.outbox = {}; }
      }
      function saveOutbox() { store.set(outboxKey(), JSON.stringify(S.outbox)); }
      function pendingCount() { return Object.keys(S.outbox).length; }

      function addOp(map, p, v) {
        Object.keys(map).forEach(function (k) { if (k.indexOf(p + '/') === 0) delete map[k]; });
        var parts = p.split('/');
        for (var i = 1; i < parts.length; i++) {
          var anc = parts.slice(0, i).join('/');
          if (Object.prototype.hasOwnProperty.call(map, anc)) {
            var av = map[anc];
            if (av === null || typeof av !== 'object') av = {};
            setAt(av, '/' + parts.slice(i).join('/'), v);
            map[anc] = av;
            return;
          }
        }
        map[p] = v;
      }
      function reapplyOutbox() {
        Object.keys(S.outbox).forEach(function (p) { setAt(R, '/' + p, S.outbox[p]); });
      }
      function queueWrite(path, value) {
        if (value === undefined) value = null;
        addOp(S.outbox, path, value);
        setAt(R, '/' + path, value);
        saveOutbox();
        scheduleFlush(false);
        renderHeader();
      }
      function scheduleFlush(now) {
        clearTimeout(S.flushTimer);
        S.flushTimer = setTimeout(function () { flush(); }, now ? 0 : 200);
      }

      function flush() {
        if (S.flushing) return S.flushing;
        var keys = Object.keys(S.outbox);
        if (!keys.length) return Promise.resolve(true);
        var sent = {};
        keys.forEach(function (k) { sent[k] = S.outbox[k]; });
        var rid = roomId;
        S.flushing = fetch(roomUrl() + '?print=silent', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sent)
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          if (rid === roomId) {
            keys.forEach(function (k) {
              if (Object.prototype.hasOwnProperty.call(S.outbox, k) && JSON.stringify(S.outbox[k]) === JSON.stringify(sent[k])) delete S.outbox[k];
            });
            saveOutbox();
          }
          S.online = true;
          S.lastSyncTimeStr = fmtClock();
          S.flushing = null;
          renderHeader();
          if (pendingCount()) scheduleFlush(false);
          return true;
        }).catch(function () {
          S.flushing = null;
          S.online = false;
          renderHeader();
          clearTimeout(S.flushTimer);
          S.flushTimer = setTimeout(function () { flush(); }, 8000);
          return false;
        });
        return S.flushing;
      }

      /* trip <-> bahagian */
      function sectionsOf(d) {
        var o = {};
        o['meta'] = JSON.stringify({
          name: d.name, limiterUid: d.limiterUid == null ? null : d.limiterUid,
          notes: d.notes || [], packNotes: d.packNotes || [],
          dayIds: (d.days || []).map(function (x) { return x.id; })
        });
        o['members'] = JSON.stringify(d.members || []);
        o['pack'] = JSON.stringify(d.pack || []);
        (d.days || []).forEach(function (y) { o['days/' + y.id] = JSON.stringify(y); });
        return o;
      }
      function tripFromNode(node) {
        try {
          if (!node || !node.meta) return null;
          var meta = JSON.parse(node.meta);
          var d = {
            name: meta.name || 'Trip', limiterUid: meta.limiterUid == null ? null : meta.limiterUid,
            notes: meta.notes || [], packNotes: meta.packNotes || [], warnings: [],
            members: node.members ? JSON.parse(node.members) : [],
            pack: node.pack ? JSON.parse(node.pack) : [],
            days: []
          };
          var dn = node.days || {}, used = {};
          (meta.dayIds || []).forEach(function (id) {
            if (dn[id]) { try { d.days.push(JSON.parse(dn[id])); used[id] = 1; } catch (e) {} }
          });
          Object.keys(dn).forEach(function (id) {
            if (!used[id]) { try { d.days.push(JSON.parse(dn[id])); } catch (e) {} }
          });
          return ensureIds(d);
        } catch (e) { return null; }
      }
      function tripInRoom(id) { return !!(R.trips && R.trips[id] && R.trips[id].meta); }
      function writeTripSections(id, prev, next) {
        var a = tripInRoom(id) && prev ? sectionsOf(prev) : {};
        var b = sectionsOf(next);
        Object.keys(b).forEach(function (k) { if (a[k] !== b[k]) queueWrite('trips/' + id + '/' + k, b[k]); });
        Object.keys(a).forEach(function (k) { if (!Object.prototype.hasOwnProperty.call(b, k)) queueWrite('trips/' + id + '/' + k, null); });
      }

      /* server -> app */
      function rebuildFromR() {
        var st = {};
        Object.keys(R.state || {}).forEach(function (k) { st[unFbKey(k)] = R.state[k]; });
        S.state = st;
        S.edits = {};
        var imp = [];
        Object.keys(R.trips || {}).sort().forEach(function (id) {
          var d = tripFromNode(R.trips[id]);
          if (!d) return;
          if (id === 'dec2026') S.edits.dec2026 = d;
          else imp.push({ id: id, name: d.name, data: d });
        });
        S.imported = imp;
        S.hideSample = !!(R.meta && R.meta.hideSample);
        store.set('konvoi.state', JSON.stringify(S.state));
        store.set('konvoi.edits', JSON.stringify(S.edits));
        store.set('konvoi.hideSample', S.hideSample ? '1' : '0');
        saveTrips();
      }
      function seedFromLocal() {
        Object.keys(S.state).forEach(function (k) { queueWrite('state/' + fbKey(k), S.state[k]); });
        Object.keys(S.edits).forEach(function (id) { writeTripSections(id, null, S.edits[id]); });
        S.imported.forEach(function (x) { writeTripSections(x.id, null, x.data); });
        if (S.hideSample) queueWrite('meta/hideSample', true);
      }
      function onRemote() {
        S.online = true;
        S.lastSyncTimeStr = fmtClock();
        reapplyOutbox();
        var sk = seededKey();
        if (!store.get(sk)) {
          store.set(sk, '1');
          if (isEmptyObj(R)) { seedFromLocal(); renderHeader(); return; }
        }
        rebuildFromR();
        rerenderSoft();
      }

      function onStream(rid, ev, isPatch) {
        if (rid !== roomId) return;
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!m || typeof m.path !== 'string') return;
        if (m.path === '/' && !isPatch) {
          R = (m.data && typeof m.data === 'object') ? m.data : {};
        } else if (isPatch) {
          Object.keys(m.data || {}).forEach(function (k) { setAt(R, joinPath(m.path, k), m.data[k]); });
        } else {
          setAt(R, m.path, m.data);
        }
        onRemote();
      }

      function closeStream() {
        if (S.es) { try { S.es.close(); } catch (e) {} S.es = null; }
      }
      function openStream() {
        closeStream();
        if (!('EventSource' in window)) { renderHeader(); return; }
        var rid = roomId, es;
        try { es = new EventSource(roomUrl()); } catch (e) { renderHeader(); return; }
        S.es = es;
        es.addEventListener('open', function () { if (rid !== roomId) return; S.online = true; renderHeader(); flush(); });
        es.addEventListener('put', function (ev) { onStream(rid, ev, false); });
        es.addEventListener('patch', function (ev) { onStream(rid, ev, true); });
        es.addEventListener('cancel', function () { S.online = false; renderHeader(); });
        es.addEventListener('auth_revoked', function () { S.online = false; renderHeader(); });
        es.onerror = function () {
          S.online = false; renderHeader();
          if (es.readyState === 2) { setTimeout(function () { if (S.es === es) openStream(); }, 5000); }
        };
      }

      function pullOnce() {
        var rid = roomId;
        return fetch(roomUrl(), { cache: 'no-store' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function (data) {
          if (rid !== roomId) return false;
          R = (data && typeof data === 'object') ? data : {};
          onRemote();
          return true;
        });
      }

      function connectLiveSync() {
        loadOutbox();
        R = {};
        openStream();
        pullOnce().then(function () { return flush(); }).catch(function () { S.online = false; renderHeader(); });
      }

      function forceSyncNow() {
        var btn = $('btnSyncNow');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Sync...'; }
        var restore = function () { if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync'; } };
        flush().then(function () { return pullOnce(); }).then(function () {
          restore();
          renderHeader();
          toast('Synced (' + S.lastSyncTimeStr + ')' + (pendingCount() ? ' · ' + pendingCount() + ' changes not sent yet.' : '.'));
          if (!S.es || S.es.readyState === 2) openStream();
        }).catch(function () {
          restore();
          S.online = false;
          renderHeader();
          toast('Cannot reach the server. Your changes are saved and will be sent when you are back online.');
        });
      }

      function setState(k, v) {
        if (v === false || v === '' || v == null) delete S.state[k]; else S.state[k] = v;
        store.set('konvoi.state', JSON.stringify(S.state));
        queueWrite('state/' + fbKey(k), (v === false || v === '' || v == null) ? null : v);
      }
      function commit(rec, d) {
        var prevData = rec.data;
        if (rec.builtin) {
          S.edits[rec.id] = d;
          store.set('konvoi.edits', JSON.stringify(S.edits));
        } else {
          var ref = S.imported.filter(function (x) { return x.id === rec.id; })[0];
          if (ref) { ref.data = d; ref.name = d.name; }
          saveTrips();
        }
        writeTripSections(rec.id, prevData, d);
      }
      function mutate(fn, redraw, undoMsg) {
        var rec = trip(), prev = JSON.stringify(rec.data), d = JSON.parse(prev);
        fn(d); commit(rec, d);
        if (redraw) render(); else renderHeader();
        if (undoMsg) toast(undoMsg, function () { commit(trip(), JSON.parse(prev)); render(); });
      }
      function saveTrips() { store.set('konvoi.trips', JSON.stringify(S.imported)); }

      function shareUrl() {
        var base = location.href.split('#')[0];
        var tab = TABS.some(function (t) { return t[0] === S.tab; }) ? S.tab : 'summary';
        return base + '#room=' + encodeURIComponent(roomId) + '&tab=' + encodeURIComponent(tab);
      }

      function copyShareLink() {
        ensureRoomInUrl(roomId);
        var url = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () {
            toast('Room link copied: ' + url);
          }).catch(function () {
            prompt('Copy this room link:', url);
          });
        } else {
          prompt('Copy this room link:', url);
        }
      }

      /* ---------- Export ---------- */
      function exportExcel(t) {
        if (!window.XLSX) { toast('Excel exporter failed to load. Please check your connection.'); return; }
        var wb = XLSX.utils.book_new();

        t.days.forEach(function (d, idx) {
          var sheetName = (d.label + (d.sub ? ' ' + d.sub : '')).replace(/[\\/?*[\]]/g, '').slice(0, 31) || ('Day ' + (idx + 1));
          var aoa = [
            ['Activity', d.title || (d.date ? 'Day ' + fmtDate(d.date) : d.label)],
            ['Stay', d.stay || ''],
            ['Google Maps', d.gmap || ''],
            ['Waze', d.waze || ''],
            [],
            ['Time', 'Activity', 'Backup', 'Comment']
          ];
          d.rows.forEach(function (r) {
            aoa.push([r.t || '', r.act || '', r.alt || '', r.note || '']);
          });
          var ws = XLSX.utils.aoa_to_sheet(aoa);
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });

        var mAoa = [['Name', 'Vehicle', 'Passenger', 'Full Tank Range']];
        t.members.forEach(function (m) {
          mAoa.push([m.name || '', m.bike || '', m.pillion || '', m.fuel || (m.range ? m.range + 'KM Full tank' : '')]);
        });
        if (t.notes && t.notes.length) {
          mAoa.push([]);
          t.notes.forEach(function (n) { mAoa.push([n]); });
        }
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mAoa), 'Members');

        var pAoa = [['Items', 'Carrier', 'Packed By', 'Comment']];
        t.pack.forEach(function (p) {
          var who = S.state[key('w', p.uid)] != null ? S.state[key('w', p.uid)] : p.who;
          var checkedNames = checkedByMembers(t, p.uid);
          pAoa.push([p.item || '', who || '', checkedNames.join(', '), p.note || '']);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pAoa), 'Packing');

        var fname = (t.name || 'Tripcrew').replace(/[^a-zA-Z0-9 _-]/g, '').trim() + '.xlsx';
        XLSX.writeFile(wb, fname);
        toast('Downloaded "' + fname + '".');
      }

      /* ---------- views ---------- */
      function renderHeader() {
        var t = trip() || { data: { days: [], members: [] } };
        var badge = $('syncBadge'), badgeTxt = $('syncBadgeTxt');
        if (badge && badgeTxt) {
          var pend = pendingCount();
          if (S.online) {

          } else {

        $('subtitle').textContent = (t.data.days.length ? t.data.days.length + ' days · ' + t.data.members.length + ' members' + (t.data.days[0].date ? ' · ' + fmtDate(t.data.days[0].date) : '') : 'Group trip planner') + ' · Room: ' + roomId;
        $('tripSel').innerHTML = trips().map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === S.tripId ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('');
        var IC = {

          packing: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',

          files: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>'

        $('tabs').innerHTML = TABS.map(function (x) { return '<button class="tab" role="tab" data-tab="' + x[0] + '" aria-selected="' + (x[0] === S.tab) + '">' + x[1] + '</button>'; }).join('');
      }

      function inp(ed, id, f, val, ph, extra) {
        return '<input type="text" class="ed" data-ed="' + ed + '" data-id="' + esc(id) + '" data-f="' + f + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '" aria-label="' + esc(ph) + '"' + (extra || '') + '>';
      }
      function dayPlace(t, d) {
        if (d.wloc) return d.wloc;
        var own = function (x) { var p = String(x.stay || '').split(','); return p.length > 1 ? p[p.length - 1].trim() : ''; };
        return own(d) || t.days.map(own).filter(Boolean)[0] || '';
      }
      function weatherLinks(place) {
        if (!place) return '';
        var q = encodeURIComponent(place);
        return '<a class="btn sm" href="https://www.accuweather.com/en/search-locations?query=' + q + '" target="_blank" rel="noopener">⛅ AccuWeather</a>' +
          '<a class="btn sm" href="https://www.google.com/search?q=rain+radar+' + q + '" target="_blank" rel="noopener">🌧 Rain radar</a>';
      }
      function guessPlace(act) {
        var m = String(act || '').replace(/\s*\([^)]*\)/g, ' ').match(/\s(?:di|at)\s(.+)$/i);
        return m ? m[1].trim() : '';
      }
      function locBtns(loc, act) {
        loc = (loc || '').trim() || guessPlace(act); if (!loc) return '';
        var url = /^https?:\/\//i.test(loc), q = encodeURIComponent(loc);
        var map = url ? loc : 'https://www.google.com/maps/search/?api=1&query=' + q;
        var waze = /waze\.com/i.test(loc) ? loc : (url ? '' : 'https://waze.com/ul?q=' + q + '&navigate=yes');

        return '<div class="links shortcuts">' + (map ? '<a class="btn sm" href="' + esc(map) + '" target="_blank" rel="noopener">📍 Maps</a>' : '') + (waze ? '<a class="btn sm" href="' + esc(waze) + '" target="_blank" rel="noopener">Waze</a>' : '') + (!url ? '<a class="btn sm" href="https://www.accuweather.com/en/search-locations?query=' + q + '" target="_blank" rel="noopener" aria-label="AccuWeather" title="AccuWeather">⛅</a>' : '') + '</div>';
      }
      function fld(label, html) { return '<label class="field"><span>' + label + '</span>' + html + '</label>'; }

      function viewRingkasan(t) {
        var days = t.days, nowInfo = liveInfo(t), ps = packStats(t), lim = getLimiter(t);
        var hero;
        if (!days.length) {
          hero = '<div><div class="count">0</div><div class="count-label">days</div></div><div class="next"><div class="t">' + esc(t.name) + '</div><div class="a">Blank trip. Tap <b>Edit</b> and open <b>Schedule</b> to add days and stops.</div></div>';
        } else if (nowInfo.mode === 'before') {
          var first = days[0].rows[0];
          hero = '<div><div class="count">' + nowInfo.n + '</div><div class="count-label">days to go</div></div>' +
            '<div class="next"><div class="k">Departs ' + fmtDate(days[0].date) + ' · ' + esc(days[0].label) + '</div><div class="t num">' + esc(first ? first.t : '') + '</div><div class="a">' + esc(first ? first.act : 'No activities yet') + '</div></div>';
        } else if (nowInfo.mode === 'live') {
          var cur = nowInfo.day.rows[nowInfo.cur], nxt = nowInfo.day.rows[nowInfo.cur + 1];
          hero = '<div><div class="count">' + esc(nowInfo.day.label.replace('Day ', '')) + '</div><div class="count-label">today</div></div>' +
            '<div class="next"><div class="k">Now</div><div class="t num">' + esc(cur ? cur.t : '') + '</div><div class="a">' + esc(cur ? cur.act : '') + '</div>' +
            (nxt ? '<div class="k" style="margin-top:10px">Next · ' + esc(nxt.t) + '</div><div class="a">' + esc(nxt.act) + '</div>' : '') + '</div>';
        } else if (nowInfo.mode === 'after') {
          hero = '<div><div class="count">✓</div><div class="count-label">done</div></div><div class="next"><div class="t">Trip finished</div><div class="a">' + esc(days[days.length - 1].title || '') + '</div></div>';
        } else {
          hero = '<div><div class="count">' + days.length + '</div><div class="count-label">days</div></div><div class="next"><div class="t">' + esc(t.name) + '</div><div class="a muted">No dates set yet.</div></div>';
        }
        var fuelStops = 0; days.forEach(function (d) { d.rows.forEach(function (r) { if (isFuelStop(r)) fuelStops++; }); });
        var stats = '<div class="stats">' +
          '<div class="stat"><b>' + days.length + '</b><span>Days</span></div>' +
          '<div class="stat"><b>' + t.members.length + '</b><span>Members</span></div>' +
          '<div class="stat"><b>' + fuelStops + '</b><span>Fuel stops</span></div>' +
          '<div class="stat"><b>' + ps.done + '/' + ps.total + '</b><span>' + esc(getActiveMember(t)) + ' packed</span></div></div>';

        var att = [];
        var activeWho = getActiveMember(t);
        var pending = t.pack.map(function (p) { return { p: p, i: p.uid }; }).filter(function (x) {
          var ck = memberNames(t).length ? isPackChecked(x.i, activeWho) : (!!S.state[key('p', x.i)] || isPackChecked(x.i, 'Shared'));
          return !ck && (isMust(x.p.note) || isMust(x.p.who));
        });
        pending.forEach(function (x) { att.push(['red', 'Must', x.p.item + ' · not ticked by ' + activeWho]); });
        var noWho = t.pack.filter(function (p) {
          var hasCarrier = !!(S.state[key('w', p.uid)] != null ? S.state[key('w', p.uid)] : p.who);
          var anyChecked = checkedByMembers(t, p.uid).length > 0 || !!S.state[key('p', p.uid)];
          return !hasCarrier && !anyChecked;
        }).length;
        if (noWho) att.push(['amber', 'Carrier', noWho + ' items have no carrier yet']);
        days.forEach(function (d) { analyze(d, lim && lim.range).forEach(function (a) { var lv = level(a.ratio); if (lv) att.push([lv, 'Fuel', d.label + ': ' + a.cum + ' km before refuelling at ' + shortAct(a.act) + ' (' + Math.round(a.ratio * 100) + '% of ' + lim.name + "'s range)"]); }); });
        t.members.filter(function (m) { return !m.range; }).forEach(function (m) { att.push(['amber', 'Member', m.name + ' has no tank range' + (m.bike ? '' : ' / no vehicle')]); });
        var attHtml = att.length ? '<ul class="list">' + att.map(function (a) { return '<li><span class="pill ' + (a[0] === 'red' ? 'red' : 'amber') + '">' + a[1] + '</span><span class="grow">' + esc(a[2]) + '</span></li>'; }).join('') + '</ul>' : '<p class="empty">Nothing needs attention.</p>';

        var notes = t.notes.concat(t.packNotes);
        var weatherHtml = '';
        var wrows = days.map(function (d) { var pl = dayPlace(t, d); return pl ? '<li><span class="pill">' + esc(d.label) + '</span><span class="grow">' + esc(pl) + (d.date ? ' · ' + fmtDate(d.date) : '') + '</span><span class="links">' + weatherLinks(pl) + '</span></li>' : ''; }).join('');
        if (wrows) weatherHtml = '<section class="panel"><h2>Weather</h2><ul class="list">' + wrows + '</ul><p class="muted small" style="margin:8px 0 0">Opens in a new tab. Set each day\'s town under Edit, Schedule, Weather location.</p></section>';
        var notesHtml = '';
        if (S.edit) {
          notesHtml = '<section class="panel"><h2>Notes</h2><ul class="list">' + notes.map(function (n, i) { return '<li><span class="grow">' + inp('note', i, 'text', n, 'Note') + '</span><button class="btn sm danger" data-rm="note" data-id="' + i + '">Delete</button></li>'; }).join('') + '</ul><div class="addbar"><button class="btn sm" data-add="note">+ Add note</button></div></section>';
        } else if (notes.length) {
          notesHtml = '<section class="panel"><h2>Trip notes</h2><ul class="list">' + notes.map(function (n) { return '<li><span class="grow">' + esc(n) + '</span></li>'; }).join('') + '</ul></section>';
        }
        var stayHtml = days.map(function (d) { return d.stay ? '<li><span class="pill">' + esc(d.label) + '</span><span class="grow">' + esc(d.stay) + '</span></li>' : ''; }).join('');
        var quickShare = '<div class="links quick-actions" style="justify-content:flex-end"><button class="btn sm" type="button" data-syncnow="1">🔄 Sync Now</button><button class="btn sm" type="button" data-copylink="1">🔗 Copy Room Link</button></div>';
        return (S.edit ? '<section class="panel"><h2>Trip name</h2>' + inp('trip', 'x', 'name', t.name, 'Trip name') + '</section>' : '') +
          '<section class="hero">' + hero + '</section>' +
          quickShare +
          stats +
          '<div class="grid2"><section class="panel"><h2>Needs attention</h2>' + attHtml + '</section>' +
          '<section class="panel"><h2>Stay</h2><ul class="list">' + (stayHtml || '<li class="muted">No stay details yet.</li>') + '</ul></section></div>' + weatherHtml + notesHtml;
      }

      function liveInfo(t) {
        var days = t.days.filter(function (d) { return d.date; });
        if (!days.length) return { mode: 'none' };
        var today = isoToday();
        var d = days.filter(function (x) { return x.date === today; })[0];
        if (d) {
          var m = mins(d.rows), n = new Date(), nowM = n.getHours() * 60 + n.getMinutes(), cur = 0;
          m.forEach(function (v, i) { if (v != null && v <= nowM) cur = i; });
          return { mode: 'live', day: d, cur: cur };
        }
        var diff = dayDiff(days[0].date);
        if (diff > 0) return { mode: 'before', n: diff };
        if (dayDiff(days[days.length - 1].date) < 0) return { mode: 'after' };
        return { mode: 'none' };
      }

      function viewJadual(t) {
        if (!t.days.length) return '<section class="panel"><h2>Schedule</h2><p class="empty">No days in this trip yet.</p><button class="btn sign" data-add="day">+ Add Day 1</button></section>';
        var live = liveInfo(t);
        if (!S.day || !t.days.some(function (d) { return d.id === S.day; })) S.day = (live.mode === 'live' ? live.day.id : t.days[0].id);
        var d = t.days.filter(function (x) { return x.id === S.day; })[0];
        var chips = '<div class="daytabs">' + t.days.map(function (x) { return '<button class="chip" data-day="' + x.id + '" aria-pressed="' + (x.id === S.day) + '">' + esc(x.label) + (x.sub ? ' · ' + esc(x.sub) : '') + '</button>'; }).join('') + (S.edit ? '<button class="chip" data-add="day">+ Day</button>' : '') + '</div>';
        if (S.edit) {
          var did = ' data-did="' + d.id + '"';
          var head = '<div class="fgrid">' + fld('Label (e.g. Day 1)', inp('day', d.id, 'label', d.label, 'Label')) + fld('Weekday', inp('day', d.id, 'sub', d.sub, 'Weekday')) +
            fld('Date', '<input type="date" class="ed" data-ed="day" data-id="' + d.id + '" data-f="date" value="' + esc(d.date) + '">') + fld('Title', inp('day', d.id, 'title', d.title, 'Title')) +
            fld('Stay / Accommodation', inp('day', d.id, 'stay', d.stay, 'Stay')) + fld('Google Maps link', inp('day', d.id, 'gmap', d.gmap, 'https://')) + fld('Waze link', inp('day', d.id, 'waze', d.waze, 'https://')) + fld('Weather location', inp('day', d.id, 'wloc', d.wloc || '', dayPlace(t, d) || 'Town or city')) + '</div>';
          var erows = d.rows.map(function (r) {
            return '<li class="erow">' + fld('Time', '<input type="time" class="ed" data-ed="row" data-id="' + r.uid + '"' + did + ' data-f="t" value="' + esc(r.t) + '">') +
              fld('Activity', inp('row', r.uid, 'act', r.act, 'Activity', did)) +
              '<div class="full">' + fld('Location (place name or Maps/Waze link)', inp('row', r.uid, 'loc', r.loc || '', 'e.g. R&R Tapah or https://maps.app.goo.gl/...', did)) + '</div>' +
              '<div class="full">' + fld('Backup activity', inp('row', r.uid, 'alt', r.alt, 'Backup', did)) + '</div>' +
              '<div class="full">' + fld('Comment / Distance (e.g. ~50 km)', '<textarea class="ed" data-ed="row" data-id="' + r.uid + '"' + did + ' data-f="note">' + esc(r.note) + '</textarea>') + '</div>' +
              '<div class="rowact"><button class="btn sm danger" data-rm="row" data-id="' + r.uid + '"' + did + '>Delete activity</button></div></li>';
          }).join('');
          return '<section class="panel"><h2>Edit schedule</h2>' + chips + '<div style="height:14px"></div>' + head + '<ul class="elist">' + erows + '</ul>' +
            '<div class="addbar"><button class="btn sm sign" data-add="row"' + did + '>+ Add activity</button><button class="btn sm danger" data-rm="day" data-id="' + d.id + '">Delete this day</button></div></section>';
        }
        var done = 0; d.rows.forEach(function (r) { if (S.state[key('d', d.id, r.uid)]) done++; });
        var links = (d.gmap ? '<a class="btn sm" href="' + esc(d.gmap) + '" target="_blank" rel="noopener">Google Maps ↗</a>' : '') + (d.waze ? '<a class="btn sm" href="' + esc(d.waze) + '" target="_blank" rel="noopener">Waze ↗</a>' : '') + weatherLinks(dayPlace(t, d));
        var cur = (live.mode === 'live' && live.day.id === d.id) ? live.cur : -1;
        var rows = d.rows.map(function (r, i) {
          var ck = !!S.state[key('d', d.id, r.uid)];
          return '<li class="' + (ck ? 'done ' : '') + (i === cur ? 'now ' : '') + (isFuelStop(r) ? 'fuel' : '') + '"><div class="time num">' + esc(r.t || '—') + '</div>' +
            '<input class="tick" type="checkbox" data-done="' + d.id + '_' + r.uid + '" aria-label="Mark done" ' + (ck ? 'checked' : '') + '>' +
            '<div><div class="act">' + (i === cur ? '<span class="pill sign">Now</span> ' : '') + esc(r.act) + '</div>' +
            (r.alt ? '<div class="alt">Backup: ' + esc(r.alt) + '</div>' : '') + (r.note ? '<div class="note">' + linkify(r.note) + '</div>' : '') + locBtns(r.loc, r.act) + '</div></li>';
        }).join('');
        return '<section class="panel">' + '<div class="dayhead"><div><h2>' + esc(d.title || d.label) + '</h2><div class="muted small">' + esc(d.stay) + '</div></div><div class="links">' + links + '</div></div>' +
          chips + '<div style="margin:14px 0 4px" class="small muted">' + done + ' / ' + d.rows.length + ' activities done</div><div class="meter"><i style="width:' + (d.rows.length ? done / d.rows.length * 100 : 0) + '%"></i></div>' +
          (rows ? '<ul class="tl">' + rows + '</ul>' : '<p class="empty">No activities yet. Tap <b>Edit</b> above to add stops.</p>') + '</section>';
      }

      function limiterSelectorHtml(t, lim) {
        var ranged = t.members.filter(function (m) { return m.range > 0; });
        if (!ranged.length || !lim) return '';
        var curVal = S.state[key('lim', 'uid')] != null ? String(S.state[key('lim', 'uid')]) : (t.limiterUid != null ? String(t.limiterUid) : '');
        var opts = '<option value=""' + (curVal === '' ? ' selected' : '') + '>Auto (Shortest tank range)</option>' +
          ranged.map(function (m) {
            return '<option value="' + esc(m.uid) + '"' + (curVal === String(m.uid) ? ' selected' : '') + '>' + esc(m.name) + ' (' + m.range + ' km)</option>';
          }).join('');
        return '<div class="lim-bar">' +
          '<div style="flex:1;min-width:200px"><b>⛽ Fuel Range Reference: ' + esc(lim.name) + ' (' + lim.range + ' km)</b><div class="small">You can switch this to any rider to set the group\'s reference distance before refuelling.</div></div>' +
          '<select data-setlimiter="1" aria-label="Select Fuel Range Reference">' + opts + '</select>' +
          '</div>';
      }

      function viewAhli(t) {
        if (S.edit) {
          return '<section class="panel"><h2>Edit members</h2><div class="members">' + t.members.map(function (m) {
            return '<article class="member">' + fld('Name', inp('mem', m.uid, 'name', m.name, 'Name')) + fld('Vehicle / Bike', inp('mem', m.uid, 'bike', m.bike, 'Vehicle / Bike')) +
              fld('Passenger / Pillion', inp('mem', m.uid, 'pillion', m.pillion, 'Passenger')) +
              fld('Full tank range (km)', '<input type="number" min="0" class="ed" data-ed="mem" data-id="' + m.uid + '" data-f="range" value="' + (m.range || '') + '" placeholder="e.g. 260">') +
              fld('Fuel note', inp('mem', m.uid, 'fuel', m.fuel, 'e.g. Full tank 260km')) +

          }).join('') + '</div><div class="addbar"><button class="btn sm sign" data-add="mem">+ Add member</button></div></section>';
        }
        if (!t.members.length) return '<section class="panel"><h2>Group members</h2><p class="empty">No members added yet. Tap <b>Edit</b> above to add members.</p></section>';
        var lim = getLimiter(t), max = Math.max.apply(null, t.members.map(function (m) { return m.range; }).concat([1]));
        return '<section class="panel"><h2>Group members</h2>' +
          '<p class="muted small" style="margin-top:0">The <b>Fuel Range Reference</b> sets the benchmark tank distance between fuel stops for the group. You can assign it to any rider below.</p>' +
          limiterSelectorHtml(t, lim) +
          '<div class="members">' + t.members.map(function (m) {
            var isLim = lim && String(m.uid) === String(lim.uid);
            var pill = isLim ? '<span class="pill amber">⛽ Fuel Reference</span>' : (m.pillion ? '<span class="pill">' + esc(m.pillion) + '</span>' : '');
            var setBtn = (!isLim && m.range > 0) ? '<button class="btn sm" type="button" data-picklim="' + esc(m.uid) + '" style="margin-top:4px">Set as Fuel Reference</button>' : '';
            return '<article class="member"><h3><span>' + esc(m.name) + '</span>' + pill + '</h3><div>' + esc(m.bike || 'No vehicle') + '</div>' +
              (m.range ? '<div class="meter ' + (isLim ? 'amber' : '') + '"><i style="width:' + m.range / max * 100 + '%"></i></div><div class="num"><b>' + m.range + ' km</b> <span class="muted small">full tank</span></div>' : '<div class="muted small">Tank range not set</div>') +
              (m.fuel ? '<div class="fuelnote">' + esc(m.fuel) + '</div>' : '') +
              setBtn + '</article>';
          }).join('') + '</div></section>';

      function viewBarangan(t) {
        var names = memberNames(t);
        var activeWho = getActiveMember(t);
        var ps = packStats(t);

        var whoBar = '';
        if (names.length) {
          var opts = names.map(function (nm) {
            return '<option value="' + esc(nm) + '"' + (nm === activeWho ? ' selected' : '') + '>' + esc(nm) + '</option>';
          }).join('');
          whoBar = '<div class="who-bar">' +
            '<span class="small"><b>Ticking as:</b></span>' +
            '<select data-pickwho="1" aria-label="Select member ticking packing list">' + opts + '</select>' +
            '<span class="muted small">Each member has their own ticks (e.g. Kamal has ticked an item, Irfan has not).</span>' +
            '</div>';
        }

        var rows = t.pack.map(function (p) {
          var ck = names.length ? isPackChecked(p.uid, activeWho) : (!!S.state[key('p', p.uid)] || isPackChecked(p.uid, 'Shared'));
          var whoList = checkedByMembers(t, p.uid);
          return { p: p, i: p.uid, ck: ck, whoList: whoList };
        }).filter(function (x) {
          return S.edit || S.filter === 'all' || (S.filter === 'todo' ? !x.ck : x.ck);
        });

        var f = function (id, l) { return '<button class="chip" data-filter="' + id + '" aria-pressed="' + (S.filter === id) + '">' + l + '</button>'; };
        var list = rows.map(function (x) {
          var who = S.state[key('w', x.i)] != null ? S.state[key('w', x.i)] : x.p.who;
          var whoIn = inp('pack', x.i, 'who', who, 'Carrier');
          var tagsHtml = x.whoList.length
            ? '<div class="who-tags">' + x.whoList.map(function (nm) { return '<span class="pill ok">✓ ' + esc(nm) + '</span>'; }).join('') + '</div>'
            : '';

          if (S.edit) {
            return '<li class="' + (x.ck ? 'done' : '') + '"><input class="tick" type="checkbox" data-pack="' + x.i + '" aria-label="Mark done for ' + esc(activeWho) + '" ' + (x.ck ? 'checked' : '') + '>' +
              '<div class="it">' + inp('pack', x.i, 'item', x.p.item, 'Item name') + inp('pack', x.i, 'note', x.p.note, 'Comment (write "must" or "wajib" if essential)') + tagsHtml + '</div>' + whoIn +
              '<button class="btn sm danger" data-rm="pack" data-id="' + x.i + '">Delete</button></li>';
          }
          return '<li class="' + (x.ck ? 'done' : '') + '"><input class="tick" type="checkbox" data-pack="' + x.i + '" aria-label="Mark packed (' + esc(activeWho) + '): ' + esc(x.p.item) + '" ' + (x.ck ? 'checked' : '') + '>' +
            '<div class="it"><span>' + esc(x.p.item) + '</span>' + (isMust(x.p.note) || isMust(x.p.who) ? ' <span class="pill red">Must bring</span>' : '') +
            (x.p.note && !isMust(x.p.note) ? '<div class="muted small">' + esc(x.p.note) + '</div>' : '') +
            tagsHtml + '</div>' + whoIn + '</li>';
        }).join('');

        return '<section class="panel"><h2>Packing list</h2>' +
          whoBar +
          '<div class="small muted" style="margin-bottom:6px">' + esc(ps.label) + '</div><div class="meter" style="margin-bottom:14px"><i style="width:' + (ps.total ? ps.done / ps.total * 100 : 0) + '%"></i></div>' +
          (S.edit ? '' : '<div class="filters">' + f('all', 'All') + f('todo', 'To pack') + f('done', 'Packed') + '</div>') +
          (list ? '<ul class="pack' + (S.edit ? ' edit' : '') + '">' + list + '</ul>' : '<p class="empty">' + (t.pack.length ? 'No items match this filter.' : 'No packing items yet. Tap Edit above to add items.') + '</p>') +
          (S.edit ? '<div class="addbar"><button class="btn sm sign" data-add="pack">+ Add item</button></div>' : '') + '</section>';
      }

      function viewMinyak(t) {
        var lim = getLimiter(t);
        if (!lim) return '<section class="panel"><h2>Fuel monitor</h2><p class="empty">Enter full-tank range for members (e.g. "260 km") on the <b>Members</b> tab to track distances between fuel stops.</p></section>';

          limiterSelectorHtml(t, lim) +

          (any ? blocks : '<section class="panel"><p class="empty">No distance estimates ("~N km") found in schedule comments.</p></section>');
      }

        return { name: 'New Trip', limiterUid: null, days: [], members: [], notes: [], pack: [], packNotes: [], warnings: [] };
      }

          '<section class="panel"><h2>Recognised Excel sheet formats</h2><div class="scroll"><table class="fmt"><thead><tr><th>Type</th><th>How it is detected</th><th>Columns</th></tr></thead><tbody>' +
          '<tr><td>Daily schedule</td><td>A sheet with a <b>Time</b> (or <b>Masa</b>) column header</td><td>Time, Activity, Backup, Comment. Header rows above: Activity / Date, Stay, Google Maps, Waze</td></tr>' +
          '<tr><td>Members</td><td>Headers <b>Name</b> and <b>Vehicle</b> (or <b>Nama</b> and <b>Jenis Motor</b>)</td><td>Name, Vehicle, Passenger, Full tank range (e.g. "380KM full tank")</td></tr>' +

          '</tbody></table></div></section>';
      }

      var VIEWS = { summary: viewRingkasan, schedule: viewJadual, members: viewAhli, packing: viewBarangan, fuel: viewMinyak, files: viewFail };
      function render() {
        renderHeader();
        if (!trip()) { $('main').innerHTML = viewWelcome(); wireDrop(); return; }
        var t = trip().data;
        $('btnEdit').setAttribute('aria-pressed', S.edit); $('btnEdit').textContent = S.edit ? 'Done' : 'Edit';
        $('main').innerHTML = (S.edit && S.tab !== 'files' ? '<div class="banner">Edit mode active. Changes are saved and synced automatically.</div>' : '') + VIEWS[S.tab](t);
        wireDrop();
      }
      function rerenderSoft() {
        var a = document.activeElement;
        if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox'))) { S.pendingRender = true; return; }
        S.pendingRender = false;
        render();
      }

      /* ---------- import ---------- */
      var toastT;
      function toast(msg, undo) {
        var el = $('toast'); el.textContent = msg; el.hidden = false;
        if (undo) { var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Undo'; b.onclick = function () { el.hidden = true; undo(); }; el.appendChild(b); }
        clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, undo ? 8000 : 4500);
      }
      function importFile(file) {
        if (!file) return;
        if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)) { toast('File must be a .xlsx spreadsheet.'); return; }
        if (!window.XLSX) { toast('Excel reader failed to load. Check your connection and try again.'); return; }
        var fr = new FileReader();
        fr.onerror = function () { toast('Could not read the file.'); };
        fr.onload = function () {
          try {
            var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' }), sheets = {};
            wb.SheetNames.forEach(function (n) { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }); });
            var data = ensureIds(parseTrip(sheets, file.name));
            if (!data.days.length && !data.members.length && !data.pack.length) { toast('No recognised sheets found. Check the Files tab for supported formats.'); return; }
            var id = 't' + Date.now().toString(36);
            var rec = { id: id, name: data.name, data: data };
            S.imported.push(rec); saveTrips();
            S.tripId = id; S.day = null; store.set('konvoi.trip', id); S.tab = 'summary'; ensureRoomInUrl(roomId);
            writeTripSections(id, null, data);
            render();
            toast(data.name + ': ' + data.days.length + ' days, ' + data.members.length + ' members, ' + data.pack.length + ' items.');
          } catch (e) { toast('Could not parse the file as an Excel workbook.'); }
        };
        fr.readAsArrayBuffer(file);
      }
      function wireDrop() {
        var d = $('drop'); if (!d) return;
        d.ondragover = function (e) { e.preventDefault(); d.classList.add('over'); };
        d.ondragleave = function () { d.classList.remove('over'); };
        d.ondrop = function (e) { e.preventDefault(); d.classList.remove('over'); importFile(e.dataTransfer.files[0]); };
      }
      window.addEventListener('dragover', function (e) { e.preventDefault(); });
      window.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]); });

      /* ---------- events ---------- */
      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-tab],[data-day],[data-filter],[data-pick],[data-open],[data-del],[data-delyes],[data-delno],[data-add],[data-rm],[data-resetedit],[data-new],[data-loadsample],[data-picklim],[data-export],[data-copylink],[data-syncnow],#btnEdit,#btnImport,#btnShareLink,#btnSyncNow');
        if (!b) return;
        var d = b.dataset;
        if (b.id === 'btnEdit') { S.edit = !S.edit; render(); return; }
        if (b.id === 'btnSyncNow' || d.syncnow) { forceSyncNow(); return; }
        if (b.id === 'btnShareLink' || d.copylink) { copyShareLink(); return; }
        if (d.export) { if (trip()) exportExcel(trip().data); return; }
        if (d.picklim) {
          setState(key('lim', 'uid'), d.picklim);
          mutate(function (x) { x.limiterUid = d.picklim; }, true);
          toast('Fuel Range Reference updated.');
          return;
        }
        if (d.new) {
          var nb = blankTrip(), nid = 't' + Date.now().toString(36); ensureIds(nb);
          S.imported.push({ id: nid, name: nb.name, data: nb }); saveTrips();
          S.tripId = nid; S.day = null; store.set('konvoi.trip', nid); S.tab = 'summary'; ensureRoomInUrl(roomId); S.edit = true;
          writeTripSections(nid, null, nb);
          render();
          toast('Created a blank new trip.');
          return;
        }
        if (d.loadsample) { S.hideSample = false; store.set('konvoi.hideSample', '0'); S.tripId = 'dec2026'; queueWrite('meta/hideSample', null); render(); return; }
        if (d.resetedit) { delete S.edits.dec2026; store.set('konvoi.edits', JSON.stringify(S.edits)); queueWrite('trips/dec2026', null); render(); toast('Restored to the original trip.'); return; }
        if (d.add) {
          mutate(function (x) {
            if (d.add === 'pack') x.pack.push({ uid: nextUid(x.pack), item: '', who: '', note: '' });
            else if (d.add === 'mem') x.members.push({ uid: nextUid(x.members), name: '', bike: '', pillion: '', fuel: '', range: 0 });
            else if (d.add === 'note') { x.notes = x.notes.concat(x.packNotes); x.packNotes = []; x.notes.push(''); }
            else if (d.add === 'row') { var dy = findDay(x, d.did); if (dy) dy.rows.push({ uid: nextUid(dy.rows), t: '', act: '', alt: '', note: '', loc: '' }); }
            else if (d.add === 'day') { var n = x.days.reduce(function (m, y) { return Math.max(m, +y.id.slice(1)); }, 0) + 1; x.days.push({ id: 'd' + n, name: '', label: 'Day ' + n, sub: '', date: '', title: '', stay: '', gmap: '', waze: '', rows: [] }); S.day = 'd' + n; S.edit = true; }
          }, true);
          return;
        }
        if (d.rm) {
          mutate(function (x) {
            var keep = function (arr) { return arr.filter(function (y) { return String(y.uid) !== d.id; }); };
            if (d.rm === 'pack') x.pack = keep(x.pack);
            else if (d.rm === 'mem') {
              x.members = keep(x.members);
              if (String(x.limiterUid) === d.id) x.limiterUid = null;
              if (String(S.state[key('lim', 'uid')]) === d.id) setState(key('lim', 'uid'), '');
            }
            else if (d.rm === 'note') { x.notes = x.notes.concat(x.packNotes); x.packNotes = []; x.notes.splice(+d.id, 1); }
            else if (d.rm === 'row') { var dy = findDay(x, d.did); if (dy) dy.rows = keep(dy.rows); }
            else if (d.rm === 'day') { x.days = x.days.filter(function (y) { return y.id !== d.id; }); S.day = null; }
          }, true, 'Deleted.');
          return;
        }
        if (b.id === 'btnImport' || d.pick) { $('fileIn').click(); return; }
        if (d.tab) { S.tab = d.tab; store.set('konvoi.tab', S.tab); ensureRoomInUrl(roomId); window.scrollTo(0, 0); }
        else if (d.day) S.day = d.day;
        else if (d.filter) S.filter = d.filter;
        else if (d.open) { S.tripId = d.open; S.day = null; store.set('konvoi.trip', S.tripId); }
        else if (d.del) S.confirmDel = d.del;
        else if (d.delno) S.confirmDel = null;
        else if (d.delyes) {
          if (d.delyes === 'dec2026') { S.hideSample = true; store.set('konvoi.hideSample', '1'); queueWrite('meta/hideSample', true); }
          else { S.imported = S.imported.filter(function (x) { return x.id !== d.delyes; }); saveTrips(); queueWrite('trips/' + d.delyes, null); }
          if (S.tripId === d.delyes) S.tripId = ''; S.confirmDel = null;
        }
        render();
      });

      document.addEventListener('change', function (e) {
        var el = e.target;
        if (el.id === 'fileIn') { importFile(el.files[0]); el.value = ''; return; }
        if (el.id === 'tripSel') { S.tripId = el.value; S.day = null; store.set('konvoi.trip', S.tripId); render(); return; }
        if (el.dataset.pickwho) {
          S.who = el.value;
          store.set('konvoi.who', S.who);
          render();
          return;
        }
        if (el.dataset.setlimiter) {
          setState(key('lim', 'uid'), el.value);
          mutate(function (x) { x.limiterUid = el.value || null; }, true);
          toast('Fuel Range Reference updated.');
          return;
        }
        if (el.dataset.done) {
          var p = el.dataset.done.split('_');
          setState(key('d', p[0], p[1]), el.checked);
          render();
        } else if (el.dataset.pack != null && el.dataset.pack !== '') {
          var curTrip = trip();
          var activeWho = curTrip && memberNames(curTrip.data).length ? getActiveMember(curTrip.data) : 'Shared';
          setState(packMemberKey(el.dataset.pack, activeWho), el.checked);
          render();
        } else if (el.dataset.ed) {
          var k = el.dataset.ed, id = el.dataset.id, f = el.dataset.f, v = el.value;
          mutate(function (x) {
            if (k === 'trip') x.name = v.trim() || x.name;
            else if (k === 'pack') { var p = byUid(x.pack, id); if (p) p[f] = v.trim(); if (f === 'who') setState(key('w', id), ''); }
            else if (k === 'row') { var dy = findDay(x, el.dataset.did); var r = dy && byUid(dy.rows, id); if (r) r[f] = f === 'note' ? v : v.trim(); }
            else if (k === 'mem') {
              var m = byUid(x.members, id);
              if (m) {
                if (f === 'range') {
                  m.range = Math.max(0, parseInt(v, 10) || 0);
                  if (!m.range && String(x.limiterUid) === String(id)) x.limiterUid = null;
                  if (!m.range && String(S.state[key('lim', 'uid')]) === String(id)) setState(key('lim', 'uid'), '');
                } else m[f] = v.trim();
              }
            }
            else if (k === 'day') { var dd = findDay(x, id); if (dd) dd[f] = v.trim(); }
            else if (k === 'note') { x.notes = x.notes.concat(x.packNotes); x.packNotes = []; x.notes[+id] = v.trim(); }
          }, false);
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        if (!S.es || S.es.readyState === 2) openStream();
        flush().then(function () { return pullOnce(); }).catch(function () {});
      });
      window.addEventListener('online', function () {
        openStream();
        flush().then(function () { return pullOnce(); }).catch(function () {});
      });
      window.addEventListener('offline', function () { S.online = false; renderHeader(); });
      document.addEventListener('focusout', function () {
        if (!S.pendingRender) return;
        setTimeout(function () { if (S.pendingRender) rerenderSoft(); }, 400);
      });

      window.addEventListener('hashchange', function () {
        var parsed = parseHash();
        var changed = false;
        if (parsed.tab && TABS.some(function (t) { return t[0] === parsed.tab; }) && parsed.tab !== S.tab) {
          S.tab = parsed.tab;
          store.set('konvoi.tab', S.tab);
          changed = true;
        }
        if (parsed.room && parsed.room !== roomId) {
          roomId = parsed.room;
          store.set('konvoi.room', roomId);
          closeStream();
          connectLiveSync();
          changed = true;
        }
        if (changed) render();
      });

      render();
      connectLiveSync();
      setInterval(function () { if (S.tab === 'summary' || S.tab === 'schedule') rerenderSoft(); }, 60000);
    })();
  </script>
</body>
</html>
