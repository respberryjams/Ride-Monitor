<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b09">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tripcrew">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Tripcrew</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg:#e9e2d3; --surface:#f7f2e6; --ink:#1c1611; --mute:#6b5f50; --line:#d4c9b4; --line-strong:#b5a78d;
      --bar:#0e0b09; --bar-2:#1d1611; --on-bar:#f3ead9; --sign:#ff6a13; --accent:#b8420a; --accent-soft:#f6dfcb;
      --amber:#7a4b00; --amber-soft:#f7e4b8; --red:#b3261e; --red-soft:#f6d6d0; --ok:#2c6b3a; --ok-soft:#d8ebd6; --track:#d9ceb8;
      --tick-ink:#1a0f06; --grain:rgba(0,0,0,.07);
      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#17120e; --surface:#231b15; --ink:#f3ead9; --mute:#a89a86; --line:#3a2f26; --line-strong:#5a4a3b;
        --bar:#0e0b09; --bar-2:#1d1611; --on-bar:#f3ead9; --sign:#ff6a13; --accent:#ff7a29; --accent-soft:#3a2314;
        --amber:#ffb02e; --amber-soft:#3a2b0e; --red:#ff7468; --red-soft:#3d1a17; --ok:#7fd18b; --ok-soft:#1d3322; --track:#3a2f26;
        --tick-ink:#1a0f06; --grain:rgba(255,255,255,.04); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:#17120e; --surface:#231b15; --ink:#f3ead9; --mute:#a89a86; --line:#3a2f26; --line-strong:#5a4a3b;
        --bar:#0e0b09; --bar-2:#1d1611; --on-bar:#f3ead9; --sign:#ff6a13; --accent:#ff7a29; --accent-soft:#3a2314;
        --amber:#ffb02e; --amber-soft:#3a2b0e; --red:#ff7468; --red-soft:#3d1a17; --ok:#7fd18b; --ok-soft:#1d3322; --track:#3a2f26;
        --tick-ink:#1a0f06; --grain:rgba(255,255,255,.04); color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { touch-action: pan-x pan-y; -ms-touch-action: pan-x pan-y; -webkit-touch-callout: none; }
    @media all and (display-mode: standalone), all and (display-mode: minimal-ui) { #btnInstall { display: none !important; } }
    html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); -webkit-text-size-adjust: 100%; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; overflow-x: clip; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
    img { max-width: 100%; }
    [hidden]:not([hidden="until-found" i]) { display: none !important; }
    h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: 0; text-wrap: balance; }
    a { color: var(--accent); }
    button, a, select, input, textarea { touch-action: manipulation; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
    .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

    /* top bar */
    .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bar); color: var(--on-bar); box-shadow: 0 4px 16px rgba(0,0,0,.14); }
    .bar-top { display: flex; align-items: center; gap: 8px; padding-block: 10px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
    .shield { flex: none; width: 38px; height: 38px; }
    .brand h1 { font-size: 1.5rem; line-height: 1; text-transform: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .brand small { display: block; font-family: var(--body); font-size: .75rem; opacity: .88; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
    .sync-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--body); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: rgba(47,122,85,.35); color: #a7f3d0; border: 1px solid rgba(167,243,208,.4); vertical-align: middle; }
    .sync-badge.local { background: rgba(255,255,255,.15); color: #fde68a; border-color: rgba(253,230,138,.4); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; display: inline-block; }
    .sync-badge.local .sync-dot { background: #fbbf24; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
    .sync-badge:not(.local) .sync-dot { animation: pulseDot 2s infinite; }

    .trip-select { background: rgba(255,255,255,.12); color: var(--on-bar); border: 1px solid rgba(255,255,255,.35); border-radius: 99px; padding: 7px 12px; font: inherit; max-width: 100%; }
    .trip-select option { color: #13211a; background: #fff; }
    .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
    .btn.sign { background: var(--sign); color: #1b1500; border-color: var(--sign); }
    .btn.sm { padding: 6px 12px; font-size: .85rem; }
    .btn.danger { color: var(--red); }
    .bar .btn:not(.sign) { background: rgba(255,255,255,.12); color: var(--on-bar); border-color: rgba(255,255,255,.35); padding-inline: 12px; }
    .btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--sign); color: #1b1500; border-color: var(--sign); }
    .tabs { display: none; }

    main { padding-block: 16px 124px; display: grid; gap: 16px; min-width: 0; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; box-shadow: 0 1px 2px rgba(70,20,40,.06), 0 10px 28px rgba(70,20,40,.05); }
    .panel > h2 { font-size: 1.45rem; margin-bottom: 10px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
    .muted { color: var(--mute); }
    .small { font-size: .875rem; }
    .num { font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .pill.ok { background: #e1f3ea; color: var(--ok); }
    .pill.sign { background: var(--sign); color: #1b1500; }

    /* hero */
    .hero { position: relative; background: var(--bar); color: var(--on-bar); border-radius: 22px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-items: center; box-shadow: 0 10px 28px rgba(70,20,40,.18); }
    .hero::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(217,164,65,.6); border-radius: 15px; pointer-events: none; }
    .hero .count { font-family: var(--display); font-weight: 600; font-style: italic; font-size: clamp(3.2rem, 13vw, 5.2rem); line-height: .92; font-variant-numeric: tabular-nums; }
    .hero .count-label { font-family: var(--body); font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
    .hero .next { border-left: 3px solid var(--sign); padding-left: 16px; min-width: 0; }
    .hero .next .k { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
    .hero .next .t { font-family: var(--display); font-size: 1.8rem; font-weight: 600; line-height: 1.15; }
    .hero .next .a { overflow-wrap: anywhere; }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .hero .next { border-left: 0; border-top: 3px solid var(--sign); padding: 12px 0 0; } }

    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 600px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } }
    .stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 1px 2px rgba(70,20,40,.05); min-width: 0; }
    .stat b { font-family: var(--display); font-weight: 600; font-size: 1.85rem; line-height: 1.05; display: block; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat span { font-size: .76rem; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .list li { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
    .list li.rowlink { cursor: pointer; border-radius: 10px; margin: 0 -8px; padding: 10px 8px; transition: background .15s; }
    .list li.rowlink:hover, .list li.rowlink:focus-visible { background: var(--accent-soft); }
    .list li.rowlink > .rowlink-a { display: flex; gap: 10px; align-items: baseline; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; text-decoration: none; color: inherit; }
    .btn.icon-only { padding: 6px 10px; font-size: 1.05rem; line-height: 1; }
    .weather-list .links { margin-left: auto; }
    .list li:first-child { border-top: 0; }
    .list .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }

    /* progress */
    .meter { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
    .meter.amber i { background: #d99a00; } .meter.red i { background: var(--red); }

    /* schedule */
    .daytabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    :root[data-theme="dark"] .chip[aria-pressed="true"] { color: #2a0f19; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #2a0f19; } }
    .dayhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .dayhead h2 { font-size: 1.65rem; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .tl { list-style: none; margin: 14px 0 0; padding: 0; }
    .tl li { display: grid; grid-template-columns: 60px 26px minmax(0, 1fr); gap: 4px 10px; padding: 12px 8px; border-radius: 10px; align-items: start; }
    .tl li + li { border-top: 1px solid var(--line); }
    .tl .time { font-family: var(--display); font-size: 1.4rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tl .act { overflow-wrap: anywhere; font-weight: 500; }
    .tl .note { white-space: pre-line; overflow-wrap: anywhere; color: var(--mute); font-size: .9rem; margin-top: 2px; }
    .tl .alt { font-size: .9rem; color: var(--mute); margin-top: 2px; }
    .tl li.done .act { text-decoration: line-through; color: var(--mute); }
    .tl li.now { background: var(--amber-soft); }
    .tl li.fuel .time::after { content: " ⛽"; font-size: .95rem; }
    .tick { width: 24px; height: 24px; accent-color: var(--accent); margin: 1px 0 0; cursor: pointer; }

    /* fuel */
    .leg { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 90px; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
    .leg:first-of-type { border-top: 0; }
    .leg .where { overflow-wrap: anywhere; font-size: .95rem; }
    .leg .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .leg.reset .where::before { content: "⛽ "; }
    @media (max-width: 520px) { .leg { grid-template-columns: minmax(0, 1fr) 82px; } .leg .meter { grid-column: 1 / -1; order: 3; } }

    /* members */
    .members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
    .member { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 6px; background: var(--surface); min-width: 0; }
    .member h3 { font-size: 1.4rem; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .member .fuelnote { font-size: .875rem; color: var(--mute); overflow-wrap: anywhere; }
    .lim-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--amber-soft); color: var(--amber); padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; }
    .lim-bar select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font: inherit; font-weight: 600; max-width: 100%; }

    /* packing */

    /* multi-select carrier dropdown */
    .c-drop { position: relative; min-width: 0; }
    .c-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--bg); color: var(--ink); font: inherit; font-weight: 600; text-align: left; min-height: 40px; }
    .c-btn:hover { border-color: var(--sign); }
    .c-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); width: 210px; max-height: 230px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: 0 10px 26px rgba(0,0,0,.28); z-index: 40; padding: 6px; }
    .c-menu.open { display: block; }
    .c-opt { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 3px; cursor: pointer; font-size: .9rem; user-select: none; }
    .c-opt:hover { background: var(--accent-soft); }
    .c-opt input { width: 17px; height: 17px; accent-color: var(--sign); margin: 0; cursor: pointer; flex: none; }
    .c-opt.all-opt { font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--line); margin-bottom: 4px; padding-bottom: 9px; }
    .c-custom { display: flex; gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
    .c-custom input { flex: 1; min-width: 0; font: inherit; font-size: .85rem; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--bg); color: var(--ink); min-height: 34px; }
    .c-custom button { padding: 4px 8px; min-height: 34px; font-size: .8rem; }
    @media (max-width: 560px) {
      .pack li > .c-drop { grid-column: 2; }
      .c-menu { left: 0; right: auto; width: 100%; max-width: 260px; }
    }
    @media (max-width: 620px) {
      .pack.edit li > .c-drop { grid-column: 2; }
    }

    .who-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--accent-soft); color: var(--ink); padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; }
    .who-bar select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font: inherit; font-weight: 600; max-width: 100%; }
    .who-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pack { list-style: none; margin: 0; padding: 0; }
    .pack li { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(120px, 200px); gap: 6px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
    .pack li.done .it > span { text-decoration: line-through; color: var(--mute); }
    .pack .it { overflow-wrap: anywhere; min-width: 0; }
    .pack input[type=text] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-width: 0; }
    @media (max-width: 560px) {
      .pack li { grid-template-columns: 28px minmax(0, 1fr); gap: 6px 10px; padding: 12px 0; }
      .pack li > input[type=text] { grid-column: 2; }
    }

    .ed { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-width: 0; }
    textarea.ed { resize: vertical; min-height: 64px; }
    .banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
    .elist { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
    .erow { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; grid-template-columns: 130px minmax(0, 1fr); align-items: end; background: var(--bg); }
    .erow .full, .erow .rowact { grid-column: 1 / -1; }
    .rowact { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 560px) { .erow { grid-template-columns: 1fr; } }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field > span { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
    .pack.edit li { grid-template-columns: 28px minmax(0, 1fr) minmax(120px, 200px) auto; align-items: start; }
    .pack.edit .it { display: grid; gap: 6px; }
    @media (max-width: 620px) {
      .pack.edit li { grid-template-columns: 28px minmax(0, 1fr); }
      .pack.edit li > * { grid-column: 2; }
      .pack.edit li > .tick { grid-column: 1; grid-row: 1; }
      .pack.edit li > .btn.danger { justify-self: end; }
    }
    .pack .it input[type=text] { grid-column: auto !important; }
    .addbar { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .toast button { margin-left: 12px; background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 3px 10px; }
    .shortcuts { margin-top: 8px; }

    /* bottom nav */
    .bnav { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.08);
      padding: 6px max(4px, calc((100% - 980px) / 2), env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, calc((100% - 980px) / 2), env(safe-area-inset-left, 0px)); }
    .bnav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 5px 2px 4px; color: var(--mute); font-size: .7rem; font-weight: 600; letter-spacing: .01em; min-width: 0; border-radius: 12px; }
    .bnav button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .bnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .bnav button[aria-current="page"] { color: var(--accent); }
    .bnav button[aria-current="page"] .ico { background: var(--accent-soft); }
    .bnav .ico { width: 46px; height: 28px; border-radius: 14px; display: grid; place-items: center; }
    .bnav button:hover { color: var(--ink); }

    @media (max-width: 720px) {
      html { -webkit-tap-highlight-color: transparent; }
      body { overscroll-behavior-y: none; font-size: 16.5px; }
      .bar-top { padding-block: 10px; gap: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; }
      .bar-top .brand { grid-column: 1; margin: 0; }
      .brand small { max-width: 100%; }
      #btnSyncNow { grid-column: 2; padding-inline: 10px; }
      #btnShareLink { grid-column: 3; padding-inline: 10px; }
      #btnEdit { grid-column: 4; padding-inline: 10px; }
      .trip-select { grid-column: 1 / -1; width: 100%; min-height: 44px; font-size: 16px; border-radius: 12px; }
      .top-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .brand h1 { font-size: 1.25rem; }
      .brand small { font-size: .72rem; }
      .shield { width: 32px; height: 32px; }
      .bar .btn { min-height: 40px; border-radius: 12px; font-size: .85rem; }
      main { padding-block: 14px 124px; gap: 14px; }
      .panel { border-radius: 16px; padding: 15px; }
      .hero { border-radius: 20px; padding: 20px 18px; }
      .stat { border-radius: 14px; }
      .btn, .chip { min-height: 44px; }
      .btn.sm { min-height: 38px; padding: 6px 12px; }
      .chip { padding: 8px 16px; }

  <script>
    /* Pure parser: sheets = { sheetName: rows[][] } -> trip object */
    function parseTrip(sheets, fileName) {
      var MONTHS = { jan:0, januari:0, january:0, feb:1, februari:1, february:1, mac:2, mar:2, march:2, apr:3, april:3,
        mei:4, may:4, jun:5, june:5, julai:6, jul:6, july:6, ogos:7, ogo:7, aug:7, august:7, sep:8, sept:8, september:8,
        okt:9, oktober:9, oct:9, october:9, nov:10, november:10, dis:11, disember:11, dec:11, december:11 };
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var s = function (v) { return v == null ? '' : String(v).trim(); };
      var low = function (v) { return s(v).toLowerCase(); };

      function timeStr(v) {
        if (typeof v === 'number' && v >= 0 && v < 1.0001) {
          var m = Math.round(v * 1440) % 1440;
          return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
        }
        if (v instanceof Date) return pad(v.getHours()) + ':' + pad(v.getMinutes());
        var t = s(v).match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);
        if (t) {
          var h = +t[1];
          if (t[3] && /pm/i.test(t[3]) && h < 12) h += 12;
          if (t[3] && /am/i.test(t[3]) && h === 12) h = 0;
          return pad(h) + ':' + t[2];
        }
        return '';
      }
      function parseDate(txt) {
        var m = s(txt).match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
        if (!m) return '';
        var mo = MONTHS[m[2].toLowerCase()];
        if (mo == null) return '';
        return m[3] + '-' + pad(mo + 1) + '-' + pad(+m[1]);
      }
      function findHeader(rows, test) {
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || [];
          for (var j = 0; j < r.length; j++) if (test(low(r[j]), r)) return i;
        }
        return -1;
      }
      function colOf(row, re) {
        for (var j = 0; j < row.length; j++) if (re.test(low(row[j]))) return j;
        return -1;
      }

      var trip = { name: '', limiterUid: null, days: [], members: [], notes: [], pack: [], packNotes: [], warnings: [] };
      var base = String(fileName || 'Trip').replace(/\.[^.]+$/, '').replace(/^[0-9a-f]{8}-/i, '').replace(/[_]+/g, ' ').trim();
      trip.name = base || 'Trip';

      Object.keys(sheets).forEach(function (name) {
        var rows = sheets[name] || [];
        var hDay = findHeader(rows, function (c) { return (c === 'masa' || c === 'time'); });
        var hPack = findHeader(rows, function (c) { return (c === 'barangan' || c === 'items' || c === 'packing list'); });
        var hMem = findHeader(rows, function (c, r) { return (c === 'nama' || c === 'name') && colOf(r, /motor|bike|vehicle|kenderaan/) >= 0; });

        if (hDay >= 0) {
          var hr = rows[hDay];
          var cAct = colOf(hr, /^(aktiviti|activity)$/), cAlt = colOf(hr, /backup/), cNote = colOf(hr, /komen|comment|notes?/);
          if (cAct < 0) cAct = 1;
          var day = { id: 'd' + (trip.days.length + 1), name: name, label: '', sub: '', date: '', title: '', stay: '', gmap: '', waze: '', rows: [] };
          var dm = name.match(/day\s*(\d+)\s*(.*)/i);
          day.label = dm ? 'Day ' + dm[1] : name;
          day.sub = dm ? dm[2].trim() : '';
          for (var i = 0; i < hDay; i++) {
            var r = rows[i] || [], k = low(r[0]), v = s(r[1]);
            if (!v) continue;
            if (k === 'aktiviti' || k === 'activity') { day.title = v; day.date = parseDate(v); }
            else if (/homestay|penginapan|hotel|stay/.test(k)) day.stay = v;
            else if (/gmap|google/.test(k)) day.gmap = v;
            else if (/waze/.test(k)) day.waze = v;
          }
          for (var j = hDay + 1; j < rows.length; j++) {
            var q = rows[j] || [];
            var act = s(q[cAct]);
            if (!act) continue;
            day.rows.push({ t: timeStr(q[0]), act: act, alt: cAlt >= 0 ? s(q[cAlt]) : '', note: cNote >= 0 ? s(q[cNote]) : '' });
          }
          trip.days.push(day);
        } else if (hPack >= 0) {
          var ph = rows[hPack];
          var cB = colOf(ph, /^(barangan|items?|packing list)$/), cW = colOf(ph, /pembawa|carrier|bringer/), cK = colOf(ph, /komen|comment|notes?/);
          var maxCol = Math.max(cB, cW, cK);
          for (var a = hPack + 1; a < rows.length; a++) {
            var pr = rows[a] || [];
            if (/^(barangan|items?|packing list)$/.test(low(pr[cB]))) continue;
            for (var c = maxCol + 1; c < pr.length; c++) if (s(pr[c])) trip.packNotes.push(s(pr[c]));
            var item = s(pr[cB]);
            if (!item) continue;
            trip.pack.push({ item: item, who: cW >= 0 ? s(pr[cW]) : '', note: cK >= 0 ? s(pr[cK]) : '' });
          }
        } else if (hMem >= 0) {
          var mh = rows[hMem];
          var cN = colOf(mh, /^(nama|name)$/), cM = colOf(mh, /motor|bike|vehicle|kenderaan/), cT = colOf(mh, /tumpang|pillion|passenger/), cF = colOf(mh, /perjalanan|tank|jarak|range/);
          for (var b = hMem + 1; b < rows.length; b++) {
            var mr = rows[b] || [];
            var nm = s(mr[cN]);
            if (nm) {
              var fuel = cF >= 0 ? s(mr[cF]) : '';
              var kms = (fuel.match(/(\d{2,3})\s*km/ig) || []).map(function (x) { return parseInt(x, 10); });
              var bike = s(mr[cM]);
              trip.members.push({
                name: nm, bike: /^n\/?a$/i.test(bike) ? '' : bike, pillion: cT >= 0 ? s(mr[cT]) : '',
                fuel: fuel, range: kms.length ? Math.max.apply(null, kms) : 0
              });
            } else {
              var txt = s(mr[0]);
              if (txt && isNaN(+txt)) trip.notes.push(txt);
            }
          }
        } else {
          trip.warnings.push('Sheet "' + name + '" was not recognised and was skipped.');
        }
      });

      trip.days.sort(function (a, b) { return (a.date || 'z').localeCompare(b.date || 'z') || (a.id < b.id ? -1 : 1); });
      trip.days.forEach(function (d, i) { d.id = 'd' + (i + 1); });
      if (!trip.days.length) trip.warnings.push('No schedule sheet (columns "Time" and "Activity") was found.');
      return trip;
    }
    if (typeof module !== 'undefined') module.exports = { parseTrip: parseTrip };
  </script>

              (m.fuel ? '<div class="fuelnote">' + esc(m.fuel) + '</div>' : '') +
              setBtn + '</article>';
          }).join('') + '</div><div class="addbar"><button class="btn sm sign" type="button" data-add="mem">+ Add member</button></div></section>';
      }

      function parseCarriers(raw, names) {
        var str = String(raw || '').trim();
        if (!str) return { all: false, picked: [], extra: '' };
        if (/^(all|everyone|semua)$/i.test(str)) return { all: true, picked: [], extra: '' };
        var parts = str.split(/\s*(?:,|&|@|\+|\/|\band\b|\bdan\b)\s*/i).map(function (s) { return s.trim(); }).filter(Boolean);
        var picked = [], extras = [], isAll = false;
        parts.forEach(function (part) {
          if (/^(all|everyone|semua)$/i.test(part)) { isAll = true; return; }
          var match = names.filter(function (nm) {
            return part.toLowerCase() === nm.toLowerCase() || part.toLowerCase().indexOf(nm.toLowerCase() + ' ') === 0;
          })[0];
          if (match) {
            if (picked.indexOf(match) === -1) picked.push(match);
          } else {
            extras.push(part);
          }
        });
        if (isAll) return { all: true, picked: [], extra: '' };
        return { all: false, picked: picked, extra: extras.join(', ') };
      }

      function formatCarriers(parsed) {
        if (parsed.all) return 'All';
        var arr = parsed.picked.slice();
        if (parsed.extra) arr.push(parsed.extra);
        return arr.join(' @ ');
      }

      function carrierDropdownHtml(uid, rawWho, names) {
        var parsed = parseCarriers(rawWho, names);
        var isOpen = String(S.openCarrierMenu) === String(uid);
        var btnLabel = 'Select carrier';
        if (parsed.all) btnLabel = 'ALL (Everyone)';
        else if (parsed.picked.length === 1 && !parsed.extra) btnLabel = parsed.picked[0];
        else if (parsed.picked.length > 1) btnLabel = parsed.picked[0] + ' +' + (parsed.picked.length - 1 + (parsed.extra ? 1 : 0));
        else if (parsed.extra) btnLabel = parsed.extra;

        var optsHtml = '<label class="c-opt all-opt">' +
          '<input type="checkbox" data-ctoggle="' + uid + '" data-cval="ALL"' + (parsed.all ? ' checked' : '') + '>' +
          '<span>ALL (Everyone)</span></label>';

        names.forEach(function (nm) {
          var ck = !parsed.all && parsed.picked.indexOf(nm) > -1;
          optsHtml += '<label class="c-opt">' +
            '<input type="checkbox" data-ctoggle="' + uid + '" data-cval="' + esc(nm) + '"' + (ck ? ' checked' : '') + '>' +
            '<span>' + esc(nm) + '</span></label>';
        });

        optsHtml += '<div class="c-custom">' +
          '<input type="text" placeholder="Custom / note..." value="' + esc(parsed.extra) + '" data-ccustom="' + uid + '" aria-label="Custom carrier note">' +
          '<button type="button" class="btn sm" data-cclose="1">OK</button>' +
          '</div>';

        return '<div class="c-drop">' +
          '<button type="button" class="c-btn" data-cmenu="' + uid + '" aria-expanded="' + isOpen + '">' +
            '<span>' + esc(btnLabel) + '</span><span>▾</span>' +
          '</button>' +
          '<div class="c-menu' + (isOpen ? ' open' : '') + '" data-cmenubox="' + uid + '">' + optsHtml + '</div>' +
        '</div>';
      }

      function viewBarangan(t) {
        var names = memberNames(t);
        var activeWho = getActiveMember(t);
        var ps = packStats(t);

        var whoBar = '';
        if (names.length) {
          if (!activeWho) {
            whoBar = '<div class="who-bar" style="display:grid"><span><b>Who are you?</b> <span class="muted small">Pick your name once. You can only tick your own items.</span></span>' +
              '<div class="links">' + names.map(function (nm) {
                return '<button class="chip" type="button" data-iam="' + esc(nm) + '">' + esc(nm) + '</button>';
              }).join('') + '</div></div>';
          } else {
            whoBar = '<div class="who-bar"><span class="small">You are <b>' + esc(activeWho) + '</b></span>' +
              '<button class="btn sm" type="button" data-switchme="1">Not you?</button>' +
              '<span class="muted small">Only you can tick for ' + esc(activeWho) + '. Other members\' ticks show as tags.</span></div>';
          }
        }

        var rows = t.pack.map(function (p) {
          var ck = names.length ? isPackChecked(p.uid, activeWho) : (!!S.state[key('p', p.uid)] || isPackChecked(p.uid, 'Shared'));
          var whoList = checkedByMembers(t, p.uid);
          var rawWho = S.state[key('w', p.uid)] != null ? S.state[key('w', p.uid)] : p.who;
          var parsedWho = parseCarriers(rawWho, names);
          return { p: p, i: p.uid, ck: ck, whoList: whoList, rawWho: rawWho, parsedWho: parsedWho };
        }).filter(function (x) {
          if (S.edit || S.filter === 'all') return true;
          if (S.filter === 'must') return isMust(x.p.note) || isMust(x.p.who);
          if (S.filter === 'nocarrier') {
            var hc = !!(x.rawWho && String(x.rawWho).trim());
            return !hc && !x.whoList.length && !S.state[key('p', x.i)];
          }
          if (S.filter.indexOf('member:') === 0) {
            var targetNm = S.filter.slice(7);
            return x.parsedWho.all || x.parsedWho.picked.some(function (n) { return n.toLowerCase() === targetNm.toLowerCase(); });
          }
          return S.filter === 'todo' ? !x.ck : x.ck;
        });

        var f = function (id, l) { return '<button class="chip" data-filter="' + esc(id) + '" aria-pressed="' + (S.filter === id) + '">' + esc(l) + '</button>'; };
        var memberFilterHtml = names.length
          ? '<select class="ed" style="width:auto;min-height:36px;padding:4px 10px;font-size:.85rem" data-filtermember="1" aria-label="Filter by carrier">' +
              '<option value="">Carrier: Any</option>' +
              names.map(function (nm) {
                var val = 'member:' + nm;
                return '<option value="' + esc(val) + '"' + (S.filter === val ? ' selected' : '') + '>' + esc(nm) + ' + All</option>';
              }).join('') +
            '</select>'
          : '';

        var list = rows.map(function (x) {
          var whoIn = carrierDropdownHtml(x.i, x.rawWho, names);
          var carrierBadges = '';
          if (x.parsedWho.all) {
            carrierBadges += '<span class="pill sign">ALL</span>';
          } else {
            x.parsedWho.picked.forEach(function (nm) {
              carrierBadges += '<span class="pill">' + esc(nm) + '</span>';
            });
            if (x.parsedWho.extra) {
              carrierBadges += '<span class="pill amber">' + esc(x.parsedWho.extra) + '</span>';
            }
          }
          var checkedBadges = x.whoList.map(function (nm) { return '<span class="pill ok">✓ ' + esc(nm) + '</span>'; }).join('');
          var tagsHtml = (carrierBadges || checkedBadges)
            ? '<div class="who-tags">' + carrierBadges + checkedBadges + '</div>'
            : '';

          if (S.edit || S.editKeys['pack:' + x.i]) {
            return '<li class="' + (x.ck ? 'done' : '') + '"><input class="tick" type="checkbox" data-pack="' + x.i + '" aria-label="Mark done for ' + esc(activeWho) + '" ' + (x.ck ? 'checked' : '') + (names.length && !activeWho ? ' disabled' : '') + '>' +
              '<div class="it">' + inp('pack', x.i, 'item', x.p.item, 'Item name') + inp('pack', x.i, 'note', x.p.note, 'Comment (write "must" or "wajib" if essential)') + tagsHtml + (S.edit ? '' : '<div><button class="btn sm sign" type="button" data-edclose="pack:' + x.i + '">Done</button></div>') + '</div>' + whoIn +
              '<button class="btn sm danger" data-rm="pack" data-id="' + x.i + '">Delete</button></li>';
          }
          return '<li class="' + (x.ck ? 'done' : '') + '"><input class="tick" type="checkbox" data-pack="' + x.i + '" aria-label="Mark packed (' + esc(activeWho) + '): ' + esc(x.p.item) + '" ' + (x.ck ? 'checked' : '') + (names.length && !activeWho ? ' disabled' : '') + '>' +
            '<div class="it"><span>' + esc(x.p.item) + '</span> <button class="pen" type="button" data-edopen="pack:' + x.i + '" aria-label="Edit item">✎</button>' + (isMust(x.p.note) || isMust(x.p.who) ? ' <span class="pill red">Must bring</span>' : '') +
            (x.p.note && !isMust(x.p.note) ? '<div class="muted small">' + esc(x.p.note) + '</div>' : '') +
            tagsHtml + '</div>' + whoIn + '</li>';
        }).join('');

        return '<section class="panel"><h2>Packing list</h2>' +
          whoBar +
          '<div class="small muted" style="margin-bottom:6px">' + esc(ps.label) + '</div><div class="meter" style="margin-bottom:14px"><i style="width:' + (ps.total ? ps.done / ps.total * 100 : 0) + '%"></i></div>' +
          (S.edit ? '' : '<div class="filters">' + f('all', 'All') + f('todo', 'To pack') + f('done', 'Packed') + f('must', 'Must bring') + f('nocarrier', 'No carrier') + memberFilterHtml + '</div>') +
          (list ? '<ul class="pack' + (S.edit ? ' edit' : '') + '">' + list + '</ul>' : '<p class="empty">' + (t.pack.length ? 'No items match this filter.' : 'No packing items yet. Tap + Add item.') + '</p>') +
          '<div class="addbar"><button class="btn sm sign" type="button" data-add="pack">+ Add item</button></div>' + '</section>';
      }

      function viewMinyak(t) {
        var lim = getLimiter(t);
        if (!lim) return '<section class="panel"><h2>Fuel monitor</h2><p class="empty">Enter full-tank range for members (e.g. "260 km") on the <b>Members</b> tab to track distances between fuel stops.</p></section>';
        var any = false;
        var blocks = t.days.map(function (d) {
          var a = analyze(d, lim.range); if (!a.length) return ''; any = true;
          return '<section class="panel"><h2>' + esc(d.label) + (d.sub ? ' · ' + esc(d.sub) : '') + '</h2>' + a.map(function (x) {
            var lv = level(x.ratio);
            return '<div class="leg ' + (x.fuel ? 'reset' : '') + '"><div class="where">' + esc(shortAct(x.act)) + '<div class="muted small num">+' + x.km + ' km · ' + esc(x.t) + '</div></div>' +
              '<div class="meter ' + lv + '"><i style="width:' + Math.min(100, x.ratio * 100) + '%"></i></div>' +
              '<div class="val">' + Math.round(x.cum) + ' km' + (lv ? '<br><span class="pill ' + lv + '">' + (lv === 'red' ? 'Over limit' : 'Getting low') + '</span>' : '') + '</div></div>';
          }).join('') + '</section>';
        }).join('');
        return '<section class="panel"><h2>Fuel monitor</h2>' +
          limiterSelectorHtml(t, lim) +
          '<p class="muted small" style="margin:0">Each row shows cumulative distance since the last fill-up; ⛽ indicates a refuel stop. Distances are read from "~N km" in schedule comments, assuming a full tank at the start of each day.</p></section>' +
          (any ? blocks : '<section class="panel"><p class="empty">No distance estimates ("~N km") found in schedule comments.</p></section>');
      }

      /* ---------- finance: running fund + payment log ---------- */
      function fmtRM(n) {
        var v = +n || 0;
        return (v < 0 ? '-' : '') + 'RM ' + Math.abs(v).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      function fundKey(nm) { return key('cp', 'fund', encodeURIComponent(String(nm).toLowerCase())); }
      function paidRows(t) {
        var names = memberNames(t), pp = +t.fund || 0, entries = t.payments || [];
        return names.map(function (nm) {
          var low = nm.toLowerCase();
          var mine = entries.filter(function (p) { return String(p.who || '').trim().toLowerCase() === low; });
          var legacy = !mine.length && !!S.state[fundKey(nm)];
          var paid = legacy ? pp : mine.reduce(function (a, p) { return a + (+p.amount || 0); }, 0);
          return { name: nm, paid: paid, legacy: legacy, pct: pp ? Math.min(100, paid / pp * 100) : 0, lunas: pp > 0 && paid >= pp - 0.005 };
        });
      }
      function finData(t) {
        var names = memberNames(t), pp = +t.fund || 0, entries = t.payments || [], rows = paidRows(t);
        var collected = entries.reduce(function (a, p) { return a + (+p.amount || 0); }, 0) +
          rows.reduce(function (a, r) { return a + (r.legacy ? r.paid : 0); }, 0);
        var spent = (t.expenses || []).reduce(function (a, e) { return a + (+e.amount || 0); }, 0);
        var target = names.length * pp;
        return {
          names: names, pp: pp, target: target, collected: collected, spent: spent, rows: rows,
          lunasN: rows.filter(function (r) { return r.lunas; }).length,
          cash: collected - spent,
          outstanding: target - collected
        };
      }
      function transactions(t) {
        var list = [];
        (t.payments || []).forEach(function (p) { list.push({ ts: p.ts || 0, kind: 'pay', label: p.who, note: p.note, amount: +p.amount || 0 }); });
        (t.expenses || []).forEach(function (e) { list.push({ ts: e.ts || 0, kind: 'exp', label: e.item, note: e.note, amount: -(+e.amount || 0) }); });
        list.sort(function (a, b) { return a.ts - b.ts; });
        var bal = 0;
        list.forEach(function (x) { bal += x.amount; x.bal = bal; });
        return list;
      }
      /* old tick-box payments become one log entry the first time the log is changed */
      function legacyMigrate(x) {
        var entries = x.payments || [];
        memberNames(x).forEach(function (nm) {
          var low = nm.toLowerCase();
          var has = entries.some(function (p) { return String(p.who || '').trim().toLowerCase() === low; });
          if (!has && S.state[fundKey(nm)]) entries.push({ uid: nextUid(entries), who: nm, amount: +x.fund || 0, note: 'Old tick-box payment', ts: 0 });
        });
        x.payments = entries;
      }
      function addPayment(who, amt, note) {
        mutate(function (x) {
          legacyMigrate(x);
          x.payments.push({ uid: nextUid(x.payments), who: who, amount: amt, note: note || '', ts: Date.now() });
        }, true);
      }
      function addExpense(item, amt, note) {
        mutate(function (x) {
          x.expenses.push({ uid: nextUid(x.expenses), item: item, amount: amt, note: note || '', ts: Date.now() });
        }, true);
      }
      function viewFinance(t) {
        var f = finData(t), editing = S.edit, ex = t.expenses || [], entries = t.payments || [];
        var stat = function (v, l, money) { return '<div class="stat"><b class="num' + (money ? ' money' : '') + '">' + v + '</b><span>' + l + '</span></div>'; };
        var cashCls = f.cash < -0.005 ? 'red' : (f.cash > 0.005 ? 'ok' : '');
        var outCls = f.outstanding > 0.005 ? 'amber' : (f.outstanding < -0.005 ? 'ok' : '');
        var outTxt = f.outstanding > 0.005 ? fmtRM(f.outstanding) + ' still to collect' : (f.outstanding < -0.005 ? fmtRM(-f.outstanding) + ' surplus' : 'Fully collected');
        var opts = function (cur, blank) {
          return (blank ? '<option value="">— Select —</option>' : '') + f.names.map(function (nm) {
            return '<option value="' + esc(nm) + '"' + (cur && String(cur).trim().toLowerCase() === nm.toLowerCase() ? ' selected' : '') + '>' + esc(nm) + '</option>';
          }).join('');
        };
        var top = '<section class="panel"><div class="fin-total">' +
          '<div><span class="small muted">Cash on hand</span><b class="num ' + cashCls + '">' + fmtRM(f.cash) + '</b>' +
          '<span class="small muted">Collected minus spent. Goes red only if more was spent than collected.</span></div>' +
          '<label class="fin-pp"><span class="small muted">Per person (RM)</span>' +
          '<input type="number" min="0" step="0.01" class="ed" data-ed="fund" data-id="fund" data-f="pp" value="' + (f.pp || '') + '" placeholder="0.00" aria-label="Per person (RM)"></label>' +
          '</div>' +
          '<div class="stats" style="margin-top:12px">' + stat(fmtRM(f.target), 'Target', true) + stat(fmtRM(f.collected), 'Collected', true) +
          stat(fmtRM(f.spent), 'Spent', true) + stat(f.lunasN + '/' + f.names.length, 'Settled') + '</div>' +
          '<p class="small" style="margin:10px 0 0"><span class="pill ' + outCls + '">' + outTxt + '</span></p></section>';

        var members = !f.names.length ? '<p class="empty">Add members on the Members tab first.</p>' :
          '<div class="fin-stack">' + f.rows.map(function (r, i) {
            var pill = !f.pp ? '' : (r.lunas ? '<span class="pill ok">Lunas</span>' : '<span class="pill amber">Baki ' + fmtRM(f.pp - r.paid) + '</span>');
            var quick = [10, 20, 50].map(function (a) {
              return '<button class="btn sm" type="button" data-pay="' + esc(r.name) + '" data-amt="' + a + '">+RM' + a + '</button>';
            }).join('');
            return '<div class="fin-block"><div class="fin-head"><b>' + esc(r.name) + '</b>' +
              (r.legacy ? '<span class="pill">Old payment</span>' : '') + pill + '</div>' +
              '<div class="meter"><i style="width:' + r.pct + '%"></i></div>' +
              '<div class="num small">' + fmtRM(r.paid) + ' of ' + fmtRM(f.pp) + '</div>' +
              '<div class="fin-quick">' + quick +
              '<span class="fin-custom"><input type="number" min="0" step="0.01" id="cust-' + i + '" placeholder="RM" aria-label="Custom amount for ' + esc(r.name) + '">' +
              '<button class="btn sm" type="button" data-paycustom="' + esc(r.name) + '" data-idx="' + i + '">Add</button></span></div></div>';
          }).join('') + '</div>';
        var members_panel = '<section class="panel"><h2>Per member</h2>' + members + '</section>';

        var form = !f.names.length ? '' :
          '<div class="fin-form"><select id="finWho" aria-label="Member">' + opts(null, true) + '</select>' +
          '<input id="finAmt" type="number" min="0" step="0.01" placeholder="RM" aria-label="Amount">' +
          '<input id="finNote" type="text" placeholder="Note (optional)" aria-label="Note">' +
          '<button class="btn sm sign" type="button" data-addpay="1">+ Add payment</button></div>';
        var legacyN = f.rows.filter(function (r) { return r.legacy; }).length;
        var log = (entries.length ? '<ul class="list">' + entries.slice().reverse().map(function (p) {
            return '<li><span class="grow"><b>' + esc(p.who) + '</b>' + (p.note ? ' <span class="muted small">· ' + esc(p.note) + '</span>' : '') + '</span>' +
              '<span class="num">' + fmtRM(p.amount) + '</span>' +
              '<button class="pen" type="button" data-rm="pay" data-id="' + p.uid + '" aria-label="Delete payment">✕</button>' + '</li>';
          }).join('') + '</ul>' : '<p class="empty">No payments logged yet.</p>') +
          (legacyN ? '<p class="muted small">' + legacyN + ' member(s) have an old tick-box payment. It moves into this log when you add a new payment.</p>' : '');
        var pay_panel = '<section class="panel"><h2>Payment log</h2>' + form + log + '</section>';

        var presets = ['Makan', 'Homestay', 'Minyak', 'Tol', 'Lain-lain'];
        var expForm = '<div class="fin-chips">' + presets.map(function (p) {
          return '<button class="chip" type="button" data-preset="' + esc(p) + '">' + esc(p) + '</button>';
        }).join('') + '</div>' +
          '<div class="fin-form"><input id="finItem" type="text" placeholder="Item, e.g. Makan" aria-label="Item">' +
          '<input id="finExAmt" type="number" min="0" step="0.01" placeholder="RM" aria-label="Amount">' +
          '<input id="finExNote" type="text" placeholder="Note (optional)" aria-label="Note">' +
          '<button class="btn sm sign" type="button" data-addexp="1">+ Add expense</button></div>';
        var exHtml = ex.map(function (e) {
          if (editing || S.editKeys['exp:' + e.uid]) return '<div class="fin-row"><div class="fin-edit">' +
            inp('exp', e.uid, 'item', e.item, 'Item') +
            '<input type="number" min="0" step="0.01" class="ed" data-ed="exp" data-id="' + e.uid + '" data-f="amount" value="' + (e.amount || '') + '" placeholder="RM" aria-label="Amount">' +
            inp('exp', e.uid, 'note', e.note, 'Note (optional)', ' style="grid-column:1/-1"') +
            '<button class="btn sm danger" type="button" data-rm="exp" data-id="' + e.uid + '">Delete</button>' + (editing ? '' : '<button class="btn sm sign" type="button" data-edclose="exp:' + e.uid + '">Done</button>') + '</div></div>';
          return '<div class="fin-row"><span class="grow"><b>' + esc(e.item || 'Untitled') + '</b>' +
            (e.note ? '<div class="small muted">' + linkify(e.note) + '</div>' : '') + '</span><span class="amt">-' + fmtRM(e.amount) + '</span><button class="pen" type="button" data-edopen="exp:' + e.uid + '" aria-label="Edit expense">✎</button></div>';
        }).join('');
        var spend = '<section class="panel"><h2>Expenses</h2>' + expForm +
          (exHtml || '<p class="empty">No expenses yet.</p>') + '</section>';

        var tx = transactions(t).slice().reverse();
        var txHtml = tx.length ? '<ul class="list">' + tx.map(function (x) {
          var sign = x.amount >= 0 ? '+' : '-';
          var cls = x.kind === 'pay' ? 'ok' : 'red';
          return '<li><span class="grow"><b>' + esc(x.label || 'Untitled') + '</b>' + (x.note ? ' <span class="muted small">· ' + esc(x.note) + '</span>' : '') + '</span>' +
            '<span class="pill ' + cls + '">' + sign + fmtRM(Math.abs(x.amount)) + '</span>' +
            '<span class="small muted num">bal ' + fmtRM(x.bal) + '</span></li>';
        }).join('') + '</ul>' : '<p class="empty">No transactions yet.</p>';
        var txPanel = '<section class="panel"><h2>Live transactions</h2><p class="muted small" style="margin-top:0">Every payment and expense, newest first, with the running cash balance after it.</p>' + txHtml + '</section>';

        return top + members_panel + pay_panel + spend + txPanel;
      }

      function blankTrip() {
        return { name: 'New Trip', limiterUid: null, days: [], members: [], notes: [], pack: [], packNotes: [], warnings: [] };
      }
      function viewWelcome() {
        return '<section class="panel"><h2>Plan your first trip</h2><p class="muted">Keep your schedule, members, packing list, and fuel stops together in one place.</p>' +
          '<div class="links"><button class="btn sign" type="button" data-new="1">+ New Trip</button><button class="btn" type="button" data-pick="1">Import .xlsx</button><button class="btn" type="button" data-loadsample="1">Load sample trip</button></div></section>';
      }
      var VIEWS = { summary: viewRingkasan, schedule: viewJadual, chat: viewChat, members: viewAhli, packing: viewBarangan, ride: viewRide, finance: viewFinance };
      function renderWhoModal() {
        var wm = $('whoModal'), wc = $('whoCard'); if (!wm || !wc) return;

          deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
        } else if (isIOS) {
          say('iPhone: tap Share, then "Add to Home Screen".');
        } else {
          say('Chrome menu (⋮), then "Install app" or "Add to Home screen".');
        }
      });

      /* lock zoom: pinch, double-tap, ctrl+wheel, ctrl +/- */
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
      var lastTouch = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now(); if (now - lastTouch < 300) e.preventDefault(); lastTouch = now;
      }, { passive: false });
      window.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) e.preventDefault();
      });
    })();
  </script>
</body>
</html>
